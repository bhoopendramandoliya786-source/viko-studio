<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d14">
<link rel="manifest" href="manifest.webmanifest">
<title>VIKO Studio</title>
<style>
:root{--bg:#070b12;--panel:#111827;--panel2:#182235;--text:#f4f7fb;--muted:#94a3b8;--a:#7c5cff;--b:#22d3ee;--line:#273449;--ok:#34d399}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1120px;margin:auto;min-height:100vh;padding-bottom:80px}.top{position:sticky;top:0;z-index:20;background:#0a0f18ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:13px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;letter-spacing:.08em}.brand span{color:var(--b)}.save,.primary{background:var(--a);color:#fff;border-radius:11px;padding:10px 14px;font-weight:750}.nav{position:sticky;top:57px;z-index:19;display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:10px 14px;background:#0a0f18ee;backdrop-filter:blur(12px)}.nav button{background:var(--panel);color:var(--muted);padding:10px 5px;border-radius:11px}.nav button.active{background:var(--panel2);color:#fff;outline:1px solid #3c4b67}.page{padding:8px 14px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.card{background:linear-gradient(180deg,#121a29,#0e1522);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:14px}.h{font-size:19px;font-weight:850;margin-bottom:9px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.field{margin:11px 0}.field label{display:block;color:#cbd5e1;font-size:13px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;background:#090f19;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;outline:0}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.secondary{background:#202c40;color:#fff;padding:10px 13px;border-radius:10px}.danger{background:#3a1820;color:#fecdd3;padding:10px 13px;border-radius:10px}.preview{min-height:360px;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#2a3a60,#101827 55%,#070b11);border-radius:16px;overflow:hidden;position:relative}.floor{position:absolute;bottom:20px;width:75%;height:35px;border-radius:50%;background:#070a0f}.viko{position:relative;width:180px;height:250px;z-index:2;animation:bob 1.7s ease-in-out infinite}.head{position:absolute;left:35px;top:25px;width:110px;height:105px;border-radius:50%;background:#f3bd8f;border:4px solid #171b26}.hair{position:absolute;left:34px;top:17px;width:112px;height:65px;background:#30253e;border-radius:60% 55% 35% 30%;transform:rotate(-5deg);z-index:2}.eye{position:absolute;top:68px;width:12px;height:17px;background:#111;border-radius:50%;z-index:3}.e1{left:62px}.e2{left:104px}.mouth{position:absolute;left:78px;top:96px;width:25px;height:10px;border-bottom:4px solid #7d3444;border-radius:50%;z-index:3}.body{position:absolute;left:43px;top:130px;width:95px;height:100px;border-radius:28px 28px 18px 18px;background:#5b6ee1;border:4px solid #171b26}.leg{position:absolute;top:215px;width:24px;height:38px;background:#26314d;border-radius:10px}.l1{left:60px}.l2{left:100px}.phone{position:absolute;right:5px;top:146px;width:32px;height:52px;background:#111827;border:3px solid #dbeafe;border-radius:6px;z-index:4}.robot{position:absolute;right:18%;bottom:70px;width:58px;height:48px;border-radius:15px;background:#7c5cff;border:3px solid #dbeafe;z-index:4;animation:float 1.4s ease-in-out infinite}.robot:before,.robot:after{content:'';position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;top:16px}.robot:before{left:14px}.robot:after{right:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0b1220;border:1px solid var(--line);padding:11px;border-radius:12px;text-align:center}.big{font-size:21px;font-weight:900}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#1e293b;color:#cbd5e1;font-size:12px;margin:3px}.scene{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#0d1522}.scene b{width:29px;height:29px;border-radius:8px;background:#202c40;display:grid;place-items:center;flex:none}.scene .grow{flex:1}.progress{height:8px;background:#0a111c;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .15s}.notice{padding:11px;border-radius:12px;background:#101c30;border:1px solid #30405b;color:#cbd5e1;font-size:13px}.videoBox{background:#05080d;border-radius:15px;padding:10px;text-align:center}.videoBox canvas{max-width:100%;width:auto;height:auto;border-radius:10px;background:#111}.pill{font-size:12px;color:var(--ok)}@keyframes bob{50%{transform:translateY(-6px)}}@keyframes float{50%{transform:translateY(-9px) rotate(2deg)}}@media(max-width:760px){.grid{grid-template-columns:1fr}.nav{top:55px}.preview{min-height:310px}.page{padding:7px 11px}.nav{padding:8px 10px}.nav button{font-size:12px}}

.sceneEdit{display:grid;grid-template-columns:42px 1fr 1.5fr 42px;gap:7px;align-items:center}.sceneEdit input{min-width:0;background:#090f19;color:#fff;border:1px solid var(--line);border-radius:9px;padding:8px}.mini{background:#202c40;color:#fff;border-radius:9px;padding:8px}.install{background:#163047;color:#dbeafe;border:1px solid #2b5474;border-radius:10px;padding:9px 12px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">VIKO <span>STUDIO</span></div><div class="actions"><button id="installBtn" class="install" onclick="installApp()" style="display:none">Install</button><button class="save" onclick="saveProject()">Save</button></div></header>
<nav class="nav">
<button id="n-studio" onclick="show('studio')">Studio</button>
<button id="n-character" onclick="show('character')">Character</button>
<button id="n-story" onclick="show('story')">Story</button>
<button id="n-animate" onclick="show('animate')">Animate</button>
<button id="n-export" onclick="show('export')">Export</button>
</nav>
<main id="root"></main>
</div>
<script>
const defaultState={page:'studio',character:{name:'Viko',personality:'Curious, funny, brave, कभी-कभी lazy लेकिन हार नहीं मानता'},story:{title:'Viko Tries to Survive 24 Hours Without His Phone',idea:'एक मजेदार 24 घंटे का no-phone challenge',challenge:'24 Hours Without Phone'},scenes:[],settings:{format:'Short — 9:16',voice:true,duration:3}};
let state=JSON.parse(JSON.stringify(defaultState));
let raf=null, recorder=null, chunks=[];
function load(){try{const x=JSON.parse(localStorage.getItem('vikoStudio'));if(x)state=Object.assign(state,x)}catch(e){}}
function saveProject(){localStorage.setItem('vikoStudio',JSON.stringify(state));toast('Project saved on this phone.')}
function toast(s){const d=document.createElement('div');d.textContent=s;d.style='position:fixed;left:50%;bottom:25px;transform:translateX(-50%);z-index:99;background:#172033;border:1px solid #3a4963;padding:11px 15px;border-radius:12px;color:#fff';document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function show(p){cancelAnimationFrame(raf);state.page=p;render()}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function preview(){return '<div class="preview"><div class="floor"></div><div class="robot"></div><div class="viko"><div class="hair"></div><div class="head"></div><div class="eye e1"></div><div class="eye e2"></div><div class="mouth"></div><div class="body"></div><div class="leg l1"></div><div class="leg l2"></div><div class="phone"></div></div></div>'}
function studio(){return '<section class="page"><div class="grid"><div>'+preview()+'</div><div><div class="card"><div class="h">Viko World</div><p class="muted">तुम्हारा अपना reusable cartoon production workspace. Character → Story → Animation → Export.</p><div class="stats"><div class="stat"><div class="big">1</div><span class="muted">Hero</span></div><div class="stat"><div class="big">'+state.scenes.length+'</div><span class="muted">Scenes</span></div><div class="stat"><div class="big">2</div><span class="muted">Formats</span></div></div></div><div class="card"><div class="h">Content system</div><span class="badge">Funny Challenges</span><span class="badge">Life Lessons</span><span class="badge">Big Challenges</span><p class="muted">एक challenge से Short, Long और compilation के लिए assets reuse होंगे।</p></div><div class="card"><div class="h">Status</div><div class="pill">● Local project storage active</div><p class="muted">अभी app तुम्हारे फोन में project data save करता है।</p></div></div></div></section>'}
function character(){return '<section class="page"><div class="grid"><div class="card">'+preview()+'</div><div class="card"><div class="h">Character Library</div><div class="field"><label>Character name</label><input id="cname" value="'+esc(state.character.name)+'"></div><div class="field"><label>Personality</label><textarea id="cp">'+esc(state.character.personality)+'</textarea></div><button class="primary" onclick="updateChar()">Update Character</button><div class="notice" style="margin-top:12px">Viko working brand name है; trademark/handle availability अभी verify नहीं की गई है।</div></div></div></section>'}
function updateChar(){state.character.name=document.getElementById('cname').value||'Viko';state.character.personality=document.getElementById('cp').value;saveProject();render()}
function story(){return '<section class="page"><div class="grid"><div class="card"><div class="h">Story Builder</div><div class="field"><label>Challenge</label><select id="stype"><option>24 Hours Without Phone</option><option>Survive With ₹0</option><option>Last To Leave The Room</option><option>Impossible Food Challenge</option><option>Custom Challenge</option></select></div><div class="field"><label>Story idea</label><textarea id="idea">'+esc(state.story.idea)+'</textarea></div><button class="primary" onclick="generate()">Generate 6 Scenes</button></div><div class="card"><div class="h">Title</div><div class="field"><input id="title" value="'+esc(state.story.title)+'"></div><p class="muted">Hook → Setup → Challenge → Twist → Climax → Ending</p></div></div><div class="card"><div class="h">Scene Timeline</div>'+(state.scenes.length?state.scenes.map((s,i)=>'<div class="sceneEdit"><b>'+(i+1)+'</b><div><input id="st'+i+'" value="'+esc(s.t)+'"><input id="sd'+i+'" value="'+esc(s.d)+'"><select id="se'+i+'"><option '+(s.e==='happy'?'selected':'')+' value="happy">😊 Happy</option><option '+(s.e==='shock'?'selected':'')+' value="shock">😲 Shock</option><option '+(s.e==='sad'?'selected':'')+' value="sad">😢 Sad</option><option '+(s.e==='angry'?'selected':'')+' value="angry">😤 Angry</option></select></div><button class="mini" onclick="removeScene('+i+')">×</button></div>').join(''):'<p class="muted">अभी scenes नहीं हैं। Generate दबाओ।</p>')+'<div class="toolbar"><button class="secondary" onclick="saveScenes()">Save Scene Edits</button><button class="secondary" onclick="addScene()">+ Add Scene</button></div></div></section>'}
function saveScenes(){state.scenes=state.scenes.map((s,i)=>({t:document.getElementById('st'+i)?.value||s.t,d:document.getElementById('sd'+i)?.value||s.d,e:document.getElementById('se'+i)?.value||s.e||'happy'}));saveProject();render()}
function removeScene(i){state.scenes.splice(i,1);saveProject();render()}
function addScene(){state.scenes.push({t:'New Scene',d:'अपना scene description यहाँ लिखो।',e:'happy'});saveProject();render()}
function generate(){state.story.title=document.getElementById('title').value||'Viko Challenge';state.story.idea=document.getElementById('idea').value;state.story.challenge=document.getElementById('stype').value;const c=state.story.challenge;state.scenes=[['Hook','Viko को पता चलता है कि आज का challenge आसान नहीं है।','shock'],['Setup','Nubi rules बताता है: '+c+'.','happy'],['Challenge Begins','पहले कुछ घंटे funny लगते हैं, फिर असली मुश्किल शुरू होती है।','happy'],['Funny Twist','एक unexpected problem आती है और Viko का plan उल्टा पड़ जाता है।','shock'],['Climax','Viko हार मानने के बजाय नया तरीका आजमाता है।','angry'],['Ending','Challenge पूरा होता है और Viko को एक छोटी life lesson मिलती है।','happy']].map(x=>({t:x[0],d:x[1],e:x[2]}));saveProject();render()}
function animatePage(){return '<section class="page"><div class="card"><div class="h">Animation Studio</div><div class="field"><label>Canvas format</label><select id="af" onchange="resizeCanvas()"><option value="short">Short — 9:16</option><option value="long">Long — 16:9</option></select></div><div class="videoBox"><canvas id="cv" width="540" height="960"></canvas><div class="progress"><i id="bar"></i></div><div id="time" class="muted">Ready</div></div><div class="actions" style="margin-top:11px"><button class="primary" onclick="playAnim()">▶ Play</button><button class="secondary" onclick="stopAnim()">■ Stop</button><button class="secondary" onclick="recordWebM()">● Record</button></div><p class="muted">Viko अब scene के हिसाब से expression, camera movement और background बदलता है।</p></div><div class="card"><div class="h">Voice & Dialogue</div><div class="field"><label>Voice text</label><textarea id="voiceText"></textarea></div><div class="actions"><button class="primary" onclick="speak()">🔊 Speak</button><button class="secondary" onclick="speechSynthesis.cancel()">Stop Voice</button></div><p class="muted">Browser की built-in speech voice इस्तेमाल होगी।</p></div></section>'}
function draw(ctx,w,h,t,scene){ctx.clearRect(0,0,w,h);const k=(w/h>1)?1:0;let bg=ctx.createLinearGradient(0,0,w,h);bg.addColorStop(0,scene?.e==='sad'?'#253044':'#263b62');bg.addColorStop(1,'#080b12');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);ctx.fillStyle=scene?.e==='angry'?'#3b2028':'#111827';ctx.fillRect(0,h*.78,w,h*.22);const cam=Math.sin(t/500)*8;ctx.save();ctx.translate(cam,0);ctx.fillStyle='#05080d';ctx.beginPath();ctx.ellipse(w/2,h*.79,w*.32,28,0,0,Math.PI*2);ctx.fill();const bob=Math.sin(t/260)*7,cx=w/2,cy=h*.44+bob;ctx.fillStyle='#26314d';ctx.fillRect(cx-48,cy+90,30,75);ctx.fillRect(cx+18,cy+90,30,75);ctx.fillStyle='#5b6ee1';roundRect(ctx,cx-65,cy+5,130,105,25);ctx.fill();ctx.fillStyle='#f3bd8f';ctx.beginPath();ctx.arc(cx,cy-30,72,0,Math.PI*2);ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#171b26';ctx.stroke();ctx.fillStyle='#30253e';ctx.beginPath();ctx.arc(cx-4,cy-72,70,Math.PI*1.02,Math.PI*1.94);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(cx-27,cy-34,8,0,Math.PI*2);ctx.arc(cx+27,cy-34,8,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#7d3444';ctx.lineWidth=5;ctx.beginPath();scene?.e==='sad'?ctx.arc(cx,cy-2,18,Math.PI,Math.PI*2):ctx.arc(cx,cy-5,18,0,Math.PI);ctx.stroke();ctx.fillStyle='#111827';roundRect(ctx,cx+63,cy+25,30,50,5);ctx.fill();ctx.strokeStyle='#dbeafe';ctx.lineWidth=3;ctx.stroke();ctx.restore();ctx.fillStyle='#fff';ctx.font='700 '+Math.max(18,w*.045)+'px system-ui';ctx.textAlign='center';ctx.fillText(scene?.t||'Viko Challenge',w/2,h*.14);ctx.font='500 '+Math.max(14,w*.032)+'px system-ui';wrap(ctx,scene?.d||'Press Play to animate.',w/2,h*.19,w*.82,Math.max(22,w*.045));}
function roundRect(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
function wrap(c,text,x,y,maxWidth,lineH){const words=String(text).split(' ');let line='';for(const word of words){const test=line+word+' ';if(c.measureText(test).width>maxWidth&&line){c.fillText(line,x,y);line=word+' ';y+=lineH}else line=test}c.fillText(line,x,y)}
function resizeCanvas(){const c=document.getElementById('cv');if(!c)return;const long=document.getElementById('af')?.value==='long';c.width=long?960:540;c.height=long?540:960;const ctx=c.getContext('2d');draw(ctx,c.width,c.height,0,state.scenes[0]||{t:'Viko Challenge',d:'Ready',e:'happy'})}
function canvasSetup(){const c=document.getElementById('cv');if(!c)return null;return c.getContext('2d')}
function playAnim(){if(!state.scenes.length){toast('पहले Story में Generate 6 Scenes करो।');return}stopAnim();const ctx=canvasSetup(),c=document.getElementById('cv'),bar=document.getElementById('bar'),time=document.getElementById('time');const total=state.scenes.length*3000,start=performance.now();function frame(now){const elapsed=now-start;if(elapsed>=total){draw(ctx,c.width,c.height,elapsed,state.scenes[state.scenes.length-1]);bar.style.width='100%';time.textContent='Finished';return}const idx=Math.min(state.scenes.length-1,Math.floor(elapsed/3000));draw(ctx,c.width,c.height,elapsed%3000,state.scenes[idx]);bar.style.width=(elapsed/total*100)+'%';time.textContent='Scene '+(idx+1)+' / '+state.scenes.length;raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame)}
function stopAnim(){if(raf)cancelAnimationFrame(raf);raf=null}
function recordWebM(){if(!state.scenes.length){toast('पहले Story में scenes बनाओ।');return}stopAnim();const c=document.getElementById('cv'),ctx=c.getContext('2d'),bar=document.getElementById('bar'),time=document.getElementById('time'),stream=c.captureStream(30),types=['video/mp4','video/webm;codecs=vp9,opus','video/webm'];let mime=types.find(x=>MediaRecorder.isTypeSupported?.(x))||'';try{recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined)}catch(e){toast('इस browser में recording supported नहीं है।');return}chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const actual=recorder.mimeType||mime||'video/webm',ext=actual.includes('mp4')?'mp4':'webm',blob=new Blob(chunks,{type:actual}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='viko-challenge.'+ext;a.click();toast(ext.toUpperCase()+' video तैयार है।')};recorder.start();const total=state.scenes.length*3000,start=performance.now();function f(now){const e=now-start;if(e>=total){draw(ctx,c.width,c.height,e,state.scenes[state.scenes.length-1]);bar.style.width='100%';recorder.stop();return}const i=Math.floor(e/3000);draw(ctx,c.width,c.height,e%3000,state.scenes[i]);bar.style.width=e/total*100+'%';time.textContent='Recording '+(i+1)+'/'+state.scenes.length;requestAnimationFrame(f)}requestAnimationFrame(f)}
function speak(){const text=document.getElementById('voiceText')?.value||state.story.title;if(!('speechSynthesis'in window)){toast('इस browser में voice उपलब्ध नहीं है।');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.95;speechSynthesis.speak(u)}
function exp(){return '<section class="page"><div class="card"><div class="h">Export Center</div><div class="field"><label>Format</label><select id="format" onchange="state.settings.format=this.value"><option>Short — 9:16</option><option>Long — 16:9</option></select></div><div class="field"><label>Scene duration</label><select id="duration"><option value="2">2 seconds</option><option value="3" selected>3 seconds</option><option value="5">5 seconds</option></select></div><div class="actions"><button class="primary" onclick="show('animate')">Open Animation</button><button class="secondary" onclick="downloadProject()">Download Project JSON</button></div><div class="notice" style="margin-top:12px">Browser export MP4 support होने पर MP4 चुना जाएगा; वरना WebM fallback होगा।</div></div><div class="card"><div class="h">Output plan</div><div class="scene"><b>1</b><div><strong>Short — 9:16</strong><div class="muted">Hook + challenge + payoff</div></div></div><div class="scene"><b>2</b><div><strong>Long — 16:9</strong><div class="muted">Full challenge story</div></div></div><div class="scene"><b>3</b><div><strong>Reusable project</strong><div class="muted">Scenes और character data editable हैं</div></div></div></div></section>'}
let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;const b=document.getElementById('installBtn');if(b)b.style.display='block'});async function installApp(){if(!installPrompt){toast('Install option अभी browser ने नहीं दिया।');return}installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById('installBtn').style.display='none'}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('n-'+state.page).classList.add('active');document.getElementById('root').innerHTML=state.page==='studio'?studio():state.page==='character'?character():state.page==='story'?story():state.page==='animate'?animatePage():exp()}
load();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
