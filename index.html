<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071522"><title>VIKO Studio — 1000 Episode Factory</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071522;color:#f7fbff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1100px;margin:auto}.top{position:sticky;top:0;z-index:20;background:#081625f2;backdrop-filter:blur(12px);padding:12px 14px;border-bottom:1px solid #26394f;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:1000;letter-spacing:1px}.brand i{color:#27d8ee;font-style:normal}.nav{position:sticky;top:55px;z-index:19;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px;background:#091827f5;border-bottom:1px solid #20334a}.nav button,.btn{border:0;border-radius:10px;background:#17283b;color:#fff;padding:10px 9px;font-weight:800}.nav .on,.primary{background:#6c52f5}.page{padding:13px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.card{background:#0d1b2b;border:1px solid #273c53;border-radius:17px;padding:14px;margin-bottom:12px}.h{font-size:20px;font-weight:950;margin-bottom:8px}.muted{color:#adbed1;line-height:1.5}.field{margin:9px 0}.field label{font-size:12px;color:#cad7e6;display:block;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border-radius:10px;border:1px solid #2b4058;background:#081421;color:#fff}.field textarea{min-height:90px}.actions{display:flex;gap:7px;flex-wrap:wrap}.wide{width:100%}.hero{border-radius:14px;overflow:hidden;background:#75cbed}.hero canvas{width:100%;display:block}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat div{background:#091725;border:1px solid #263b52;border-radius:11px;padding:9px;text-align:center}.stat b{display:block;font-size:19px}.small{font-size:12px;color:#91a4ba}.notice{padding:10px;border-radius:11px;background:#12263b;color:#c9d8e8;font-size:13px}.queue{display:grid;gap:7px}.q{background:#091725;border:1px solid #293e55;border-radius:11px;padding:9px}.q.on{border-color:#755eff}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{background:#1a2b40;padding:3px 7px;border-radius:99px;font-size:11px}.bar{height:8px;background:#06101b;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#27d8ee}.footer{text-align:center;color:#72869d;padding:18px;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.nav button{font-size:11px;padding:9px 3px}}
</style></head><body><div class="app">
<header class="top"><div class="brand">VIKO <i>1000 EPISODE FACTORY</i></div><button id="save" class="btn primary">Save</button></header>
<nav class="nav"><button data-p="factory">Factory</button><button data-p="character">Character</button><button data-p="episode">Episode</button><button data-p="video">Video</button><button data-p="export">Export</button></nav>
<main id="root"></main><div class="footer">Viko World • Original characters and stories • Built for repeatable episode production</div></div>
<script>
(()=>{'use strict';
const KEY='vikoFactoryV1';const D={page:'factory',name:'Viko',companion:'Nubi',count:1000,episode:1,scenes:[],queue:[],theme:'New Journey'};let s={...D,scenes:[],queue:[]},active=0,playing=false,rec=null;
const places=['Viko City','Viko Home','Viko Public School','Sunny Park','Mystery Cave','City Sunset'];const actions=['walk','talk','run','jump','look','celebrate'];const moods=['excited','happy','surprised','worried','brave','happy'];
const hooks=['एक अजीब signal मिला','एक secret box मिला','आज Viko ने impossible challenge लिया','Nubi अचानक गायब हो गया','School में mystery शुरू हुई','Park में glowing clue मिला','City में strange sound आया','एक hidden door मिल गया'];
const goals=['clue solve करना','Nubi को ढूँढना','challenge पूरा करना','घर सुरक्षित पहुँचना','mystery का सच पता करना','एक दोस्त की मदद करना'];
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x)s={...D,...x,scenes:Array.isArray(x.scenes)?x.scenes:[],queue:Array.isArray(x.queue)?x.queue:[]}}catch(e){s={...D,scenes:[],queue:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function esc(x){return String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function seeded(n){let x=Math.sin(n*999.91)*43758.5453;return x-Math.floor(x)}
function makeEpisode(n){let a=Math.floor(seeded(n)*hooks.length),b=Math.floor(seeded(n+7)*goals.length),c=Math.floor(seeded(n+13)*places.length);let hook=hooks[a],goal=goals[b],loc=places[c];return {id:n,title:'Viko New Journey #'+n+' — '+hook.charAt(0).toUpperCase()+hook.slice(1),description:'Viko और Nubi की नई journey: '+hook+' और अब उन्हें '+goal+' है।',scenes:[
{title:'HOOK',text:'आज Viko के सामने '+hook+'। क्या वह इस mystery को समझ पाएगा?',place:places[0],action:'look',emotion:'surprised',duration:5},
{title:'SETUP',text:'Viko और Nubi '+loc+' की ओर निकलते हैं। उनका goal है '+goal+'।',place:loc,action:'walk',emotion:'excited',duration:7},
{title:'DISCOVERY',text:'उन्हें एक नया clue मिलता है। Nubi signal पकड़ता है और Viko ध्यान से उसे देखता है।',place:places[(c+1)%places.length],action:'look',emotion:'surprised',duration:7},
{title:'TWIST',text:'अचानक situation बदल जाती है। Viko को तेजी से action लेना पड़ता है।',place:places[(c+2)%places.length],action:'run',emotion:'worried',duration:7},
{title:'CLIMAX',text:'Viko डरता जरूर है, लेकिन हिम्मत करके आखिरी challenge पूरा करता है।',place:places[(c+3)%places.length],action:'jump',emotion:'brave',duration:8},
{title:'ENDING',text:'Mystery solve हो जाती है। Viko और Nubi हंसते हुए अगली journey के लिए निकलते हैं।',place:places[5],action:'celebrate',emotion:'happy',duration:6}
],hashtags:'#Viko #VikoNewJourney #Cartoon #KidsStories #FunnyCartoon #Adventure'};
}
function buildQueue(count){s.queue=[];for(let i=1;i<=count;i++)s.queue.push(makeEpisode(i));s.episode=1;s.scenes=s.queue[0].scenes;active=0;save();render()}
function factory(){return '<section class="page"><div class="grid"><div><div class="card"><div class="h">🏭 1000 Video Factory</div><p class="muted">एक बार character/world तय करो, फिर हजार original episode ideas का production queue बनाओ। हर episode में 6 scenes, title, description और hashtags होंगे।</p><div class="field"><label>कितने episodes का queue बनाना है?</label><select id="count"><option value="10">10</option><option value="50">50</option><option value="100">100</option><option value="500">500</option><option value="1000" selected>1000</option></select></div><button id="build" class="btn primary wide">⚡ Generate Episode Factory</button></div><div class="card"><div class="h">Production status</div><div class="stat"><div><b>'+s.queue.length+'</b><span class="small">Queued</span></div><div><b>'+s.scenes.length+'</b><span class="small">Current scenes</span></div><div><b>'+s.episode+'</b><span class="small">Current #</span></div></div></div></div><div class="card"><div class="h">🎨 Graphics system</div><p class="muted">एक consistent Viko + Nubi, colorful locations, wide/medium/close-up feel और action scenes। यह original cartoon universe है; किसी existing show के characters/assets copy नहीं किए जाते।</p><div class="notice">Professional TV-quality assets के लिए बाद में proper character/background image assets या rigged 3D model जोड़ना होगा। यह factory अभी production planning + browser rendering को automate करता है।</div></div></div><div class="card"><div class="h">Episode Queue</div><div class="queue">'+s.queue.slice(0,20).map((e,i)=>'<div class="q '+(i===s.episode-1?'on':'')+'"><b>#'+e.id+' '+esc(e.title)+'</b><div class="small">'+e.scenes.length+' scenes • '+e.scenes.reduce((a,x)=>a+x.duration,0)+' sec</div></div>').join('')+(s.queue.length>20?'<div class="small">पहले 20 दिखाए जा रहे हैं • बाकी '+(s.queue.length-20)+' queue में हैं।</div>':'')+'</div></div></section>'}
function character(){return '<section class="page"><div class="grid"><div class="card"><div class="hero"><canvas id="art" width="720" height="520"></canvas></div></div><div class="card"><div class="h">👦 Viko + 🤖 Nubi</div><div class="field"><label>Viko Name</label><input id="name" value="'+esc(s.name)+'"></div><div class="field"><label>Companion</label><input id="companion" value="'+esc(s.companion)+'"></div><button id="charSave" class="btn primary">Save Character</button><p class="muted">इनका look पूरे 1000-episode library में एक जैसा रखने का नियम रखा गया है।</p></div></div></section>'}
function episode(){let x=s.scenes[active];return '<section class="page"><div class="card"><div class="h">📝 Episode Builder</div><div class="field"><label>Episode number</label><input id="epno" type="number" min="1" max="'+Math.max(1,s.queue.length)+'" value="'+s.episode+'"></div><button id="loadEp" class="btn primary">Load Episode</button><div class="field"><label>Title</label><input id="title" value="'+esc(x?.title||'')}"></div><div class="field"><label>Story / Description</label><textarea id="desc">'+esc(x?.text||'')+'</textarea></div></div><div class="card"><div class="h">Scenes</div><div class="queue">'+s.scenes.map((z,i)=>'<div class="q '+(i===active?'on':'')+'" data-sc="'+i+'"><b>'+(i+1)+'. '+esc(z.title)+'</b><div class="small">'+esc(z.place)+' • '+esc(z.action)+' • '+z.duration+' sec</div><p class="muted">'+esc(z.text)+'</p></div>').join('')+'</div></div></section>'}
function video(){return '<section class="page"><div class="card"><div class="h">🎬 Video Renderer</div><div class="hero"><canvas id="vid" width="720" height="1280"></canvas></div><div class="bar"><i id="meter"></i></div><p id="cap" class="muted">Current episode ready.</p><div class="actions"><button id="play" class="btn primary">▶ Play Full Episode</button><button id="stop" class="btn">■ Stop</button><button id="rec" class="btn">● Record WebM</button></div><div class="notice" style="margin-top:8px">यह browser renderer है। 1000 episodes का queue तैयार हो सकता है, लेकिन हर video को render करने में उसके duration जितना समय लगेगा; app बंद करके background में 1000 videos render नहीं करेगा।</div></div></section>'}
function exportPage(){return '<section class="page"><div class="card"><div class="h">📦 1000-Video Export</div><p class="muted">पूरी queue का metadata, scripts और scene plans एक JSON file में export करो। YouTube पर publish करने से पहले हर video को review/edit करना जरूरी है।</p><div class="actions"><button id="json" class="btn primary">Download All Episodes JSON</button><button id="csv" class="btn">Download Titles CSV</button><button id="videoOpen" class="btn">Open Video Renderer</button></div></div><div class="card"><div class="h">हर episode में</div><div class="tags"><span class="tag">Original title</span><span class="tag">6 scenes</span><span class="tag">Narration</span><span class="tag">Locations</span><span class="tag">Actions</span><span class="tag">Hashtags</span><span class="tag">9:16 video plan</span></div></div></section>'}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===s.page));document.getElementById('root').innerHTML=s.page==='factory'?factory():s.page==='character'?character():s.page==='episode'?episode():s.page==='video'?video():exportPage();bind();draw()}
function bind(){document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{s.page=b.dataset.p;save();render()});document.getElementById('save').onclick=()=>{save();document.getElementById('save').textContent='Saved ✓';setTimeout(()=>document.getElementById('save').textContent='Save',900)};let b=document.getElementById('build');if(b)b.onclick=()=>buildQueue(+document.getElementById('count').value);let cs=document.getElementById('charSave');if(cs)cs.onclick=()=>{s.name=document.getElementById('name').value||'Viko';s.companion=document.getElementById('companion').value||'Nubi';save();render()};let le=document.getElementById('loadEp');if(le)le.onclick=()=>{let n=Math.max(1,Math.min(s.queue.length||1,+document.getElementById('epno').value||1));s.episode=n;s.scenes=s.queue[n-1]?.scenes||makeEpisode(n).scenes;active=0;save();render()};document.querySelectorAll('[data-sc]').forEach(z=>z.onclick=()=>{active=+z.dataset.sc;render()});let pl=document.getElementById('play');if(pl)pl.onclick=play;let st=document.getElementById('stop');if(st)st.onclick=()=>playing=false;let rr=document.getElementById('rec');if(rr)rr.onclick=record;let jo=document.getElementById('json');if(jo)jo.onclick=()=>download('viko-1000-episodes.json',JSON.stringify(s.queue,null,2),'application/json');let cv=document.getElementById('csv');if(cv)cv.onclick=()=>download('viko-1000-titles.csv','Episode,Title,Description,Hashtags\n'+s.queue.map(e=>e.id+',"'+e.title.replaceAll('"','""')+'","'+e.description.replaceAll('"','""')+'","'+e.hashtags+'"').join('\n'),'text/csv');let vo=document.getElementById('videoOpen');if(vo)vo.onclick=()=>{s.page='video';save();render()}}
function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
function bg(x,w,h,p){let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,p.includes('Cave')?'#16152b':p.includes('Sunset')?'#ed865f':'#62bce8');g.addColorStop(.62,p.includes('Cave')?'#2a2540':p.includes('Sunset')?'#f4c56b':'#d9f4ff');g.addColorStop(1,p.includes('Home')?'#8e6952':'#67a95b');x.fillStyle=g;x.fillRect(0,0,w,h);if(p.includes('City')||p.includes('School')){x.fillStyle='#f5cc72';x.beginPath();x.arc(w*.82,h*.15,w*.07,0,7);x.fill();for(let i=0;i<8;i++){let bx=i*w/8;x.fillStyle=i%2?'#d98c62':'#8d70b8';x.fillRect(bx+5,h*.48,w*.105,h*.3);x.fillStyle='#fff0a6';for(let q=0;q<3;q++)x.fillRect(bx+18+q*22,h*.54,w*.018,h*.04)}}if(p.includes('Park')||p.includes('Sunset')){for(let i=0;i<9;i++){let tx=30+i*w/9;x.fillStyle='#674a35';x.fillRect(tx,h*.53,12,h*.2);x.fillStyle='#2e7b46';x.beginPath();x.arc(tx+6,h*.5,38,0,7);x.fill()}x.fillStyle='#75a9c1';x.fillRect(0,h*.78,w,h*.03)}if(p.includes('Home')){x.fillStyle='#e8d2b8';x.fillRect(0,h*.35,w,h*.43);x.fillStyle='#b77b53';x.fillRect(w*.57,h*.43,w*.3,h*.09);x.fillStyle='#e5bf67';x.fillRect(w*.12,h*.48,w*.2,h*.23)}if(p.includes('Cave')){x.fillStyle='#29203d';x.beginPath();x.arc(w*.5,h*.62,w*.36,Math.PI,0);x.fill();x.fillStyle='#25d9ed';x.beginPath();x.arc(w*.5,h*.66,w*.06,0,7);x.fill()}}
function rr(x,cx,cy,w,h,r){x.beginPath();x.roundRect(cx-w/2,cy-h/2,w,h,r);x.fill()}
function viko(x,cx,cy,z,act,mood){x.save();x.translate(cx,cy);let t=performance.now()/1000, bob=act==='jump'?Math.abs(Math.sin(t*5))*z*.2:Math.sin(t*4)*z*.025;x.translate(0,bob);let lean=act==='run'?Math.sin(t*10)*.06:0;x.rotate(lean);x.fillStyle='#151d2d';rr(x,0,z*.32,z*.68,z*.95,z*.12);x.fillStyle='#26334f';rr(x,0,z*.28,z*.7,z*.64,z*.12);x.fillStyle='#3f70e5';rr(x,0,-z*.02,z*.78,z*.58,z*.13);x.fillStyle='#f1b58a';x.beginPath();x.arc(0,-z*.52,z*.34,0,7);x.fill();x.fillStyle='#2b2035';x.beginPath();x.arc(0,-z*.67,z*.35,Math.PI,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(-z*.11,-z*.52,z*.065,0,7);x.arc(z*.11,-z*.52,z*.065,0,7);x.fill();x.fillStyle='#182033';x.beginPath();x.arc(-z*.11,-z*.52,z*.03,0,7);x.arc(z*.11,-z*.52,z*.03,0,7);x.fill();x.strokeStyle='#8b4052';x.lineWidth=z*.025;x.beginPath();mood==='surprised'?x.arc(0,-z*.39,z*.07,0,7):x.arc(0,-z*.39,z*.1,0,Math.PI);x.stroke();let leg=act==='run'?Math.sin(t*10)*z*.2:0;x.fillStyle='#f1b58a';rr(x,-z*.16+leg,z*.63,z*.18,z*.62,z*.06);rr(x,z*.16-leg,z*.63,z*.18,z*.62,z*.06);x.strokeStyle='#f1b58a';x.lineWidth=z*.09;x.lineCap='round';x.beginPath();let arm=act==='run'?Math.sin(t*10)*z*.35:0;x.moveTo(-z*.36,z*-.02);x.lineTo(-z*.5,z*.25+arm);x.moveTo(z*.36,z*-.02);x.lineTo(z*.5,z*.25-arm);x.stroke();x.restore()}
function nubi(x,cx,cy,z){x.save();x.translate(cx,cy);x.fillStyle='#7556ef';x.beginPath();x.ellipse(0,0,z,z*.7,0,0,7);x.fill();x.fillStyle='#111827';x.beginPath();x.ellipse(0,0,z*.72,z*.42,0,0,7);x.fill();x.fillStyle='#26d9ed';x.beginPath();x.arc(-z*.22,0,z*.08,0,7);x.arc(z*.22,0,z*.08,0,7);x.fill();x.restore()}
function draw(){let c=document.getElementById('art')||document.getElementById('vid');if(!c)return;let x=c.getContext('2d'),w=c.width,h=c.height,sc=s.scenes[active]||makeEpisode(s.episode||1).scenes[0];bg(x,w,h,sc.place);viko(x,w*.46,h*.68,Math.min(w,h)*.22,sc.action,sc.emotion);nubi(x,w*.69,h*.45,Math.min(w,h)*.09);x.fillStyle='#06101dcc';x.fillRect(0,h*.83,w,h*.17);x.fillStyle='#fff';x.font='bold '+Math.max(20,w*.035)+'px system-ui';x.fillText('VIKO NEW JOURNEY',w*.05,h*.89);x.font=Math.max(14,w*.022)+'px system-ui';x.fillText('Episode '+s.episode+' • '+sc.title,w*.05,h*.95)}
function play(){if(!s.scenes.length){alert('Factory में पहले episodes generate करो।');return}playing=true;let start=performance.now(),total=s.scenes.reduce((a,x)=>a+(+x.duration||6),0)*1000;function tick(now){if(!playing)return;let e=now-start,acc=0,i=0;while(i<s.scenes.length&&e>=acc+(+s.scenes[i].duration||6)*1000){acc+=(+s.scenes[i].duration||6)*1000;i++}if(i>=s.scenes.length){playing=false;draw();return}active=i;let c=document.getElementById('vid');if(c){draw();let m=document.getElementById('meter');if(m)m.style.width=e/total*100+'%';let cap=document.getElementById('cap');if(cap)cap.textContent='Scene '+(i+1)+' — '+s.scenes[i].title+' • '+s.scenes[i].text}requestAnimationFrame(tick)}requestAnimationFrame(tick)}
function record(){let c=document.getElementById('vid');if(!c||!c.captureStream){alert('इस browser में recording supported नहीं है।');return}if(!s.scenes.length){alert('Factory में पहले episodes generate करो।');return}let type='video/webm',chunks=[],r;try{r=new MediaRecorder(c.captureStream(30),{mimeType:type})}catch(e){r=new MediaRecorder(c.captureStream(30))}r.ondataavailable=e=>e.data.size&&chunks.push(e.data);r.onstop=()=>download('viko-episode-'+s.episode+'.webm',new Blob(chunks,{type}),'video/webm');r.start();playing=true;let start=performance.now(),total=s.scenes.reduce((a,x)=>a+(+x.duration||6),0)*1000;function tick(now){let e=now-start;if(e>=total){playing=false;r.stop();return}let acc=0,i=0;while(i<s.scenes.length&&e>=acc+(+s.scenes[i].duration||6)*1000){acc+=(+s.scenes[i].duration||6)*1000;i++}active=i;draw();requestAnimationFrame(tick)}requestAnimationFrame(tick)}
load();render();
})();
</script></body></html>
