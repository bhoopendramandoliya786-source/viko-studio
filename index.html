<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071522"><title>VIKO Studio — Episode Factory</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071522;color:#f6fbff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1080px;margin:auto}.top{position:sticky;top:0;z-index:10;background:#081625f5;padding:12px 14px;border-bottom:1px solid #263b52;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:1000;letter-spacing:1px}.brand i{font-style:normal;color:#26d9ed}.nav{position:sticky;top:55px;z-index:9;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px;background:#091827f5}.nav button,.btn{border:0;border-radius:10px;background:#17293c;color:#fff;padding:10px 9px;font-weight:850}.on,.primary{background:#6b52f5!important}.page{padding:13px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.card{background:#0d1b2b;border:1px solid #273d55;border-radius:17px;padding:14px;margin-bottom:12px}.h{font-size:20px;font-weight:950;margin-bottom:8px}.muted{color:#adbed0;line-height:1.5}.field{margin:9px 0}.field label{font-size:12px;color:#cbd8e7;display:block;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #2b4058;border-radius:10px;background:#081421;color:#fff}.field textarea{min-height:100px}.actions{display:flex;gap:7px;flex-wrap:wrap}.wide{width:100%}.hero{overflow:hidden;border-radius:14px;background:#78cbed}.hero canvas{display:block;width:100%;height:auto}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat div{background:#091725;border:1px solid #263a51;border-radius:11px;padding:9px;text-align:center}.stat b{display:block;font-size:19px}.small{font-size:12px;color:#8fa3b9}.bar{height:8px;background:#06101b;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#27d9ed}.scene{background:#091725;border:1px solid #293f56;border-radius:11px;padding:9px;margin:7px 0}.scene.on{border-color:#725cff}.tag{display:inline-block;background:#1a2b40;border-radius:99px;padding:3px 7px;margin:2px;font-size:11px}.notice{padding:10px;background:#12263b;border-radius:11px;color:#c9d7e7;font-size:13px}.footer{text-align:center;color:#72869d;padding:18px;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.nav button{font-size:10px;padding:9px 2px}}
</style></head><body><div class="app">
<header class="top"><div class="brand">VIKO <i>EPISODE FACTORY</i></div><button id="save" class="btn primary">Save</button></header>
<nav class="nav"><button data-p="factory">Factory</button><button data-p="character">Character</button><button data-p="episode">Episode</button><button data-p="video">Video</button><button data-p="export">Export</button></nav>
<main id="root"></main><div class="footer">Original Viko World • Repeatable production system</div></div>
<script>
(()=>{'use strict';
const KEY='vikoFinalFactoryV2',TOTAL_SCENES=40,SCENE_SEC=30,SHORT_SEC=60;
const D={page:'factory',name:'Viko',companion:'Nubi',episodeNo:1,title:'Viko New Journey',scenes:[],library:[],shorts:[]};let s={...D},active=0,playing=false;
const places=['Viko City','Viko Home','Public School','Sunny Park','Mystery Cave','City Market','River Road','City Sunset'];
const actions=['walk','talk','run','jump','look','celebrate'];const moods=['excited','happy','surprised','worried','brave','happy'];
const hooks=['एक रहस्यमयी signal मिला','एक secret box मिला','आज impossible challenge शुरू हुआ','Nubi अचानक गायब हो गया','School में mystery शुरू हुई','Park में glowing clue मिला','City में strange sound आया','एक hidden door मिला','एक अजीब map मिला','रात में lights अपने-आप जलने लगीं'];
const goals=['mystery solve करना','Nubi को ढूँढना','challenge पूरा करना','घर सुरक्षित पहुँचना','clue का सच पता करना','एक दोस्त की मदद करना','secret place तक पहुँचना','City को बचाना'];
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x)s={...D,...x,scenes:Array.isArray(x.scenes)?x.scenes:[],library:Array.isArray(x.library)?x.library:[],shorts:Array.isArray(x.shorts)?x.shorts:[]}}catch(e){s={...D}}}
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function esc(v){return String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function rnd(n,max){let x=Math.sin(n*9187.37)*43758.5453;return Math.floor((x-Math.floor(x))*max)}
function makeEpisode(n){let h=hooks[rnd(n, hooks.length)],g=goals[rnd(n+3,goals.length)],base=rnd(n+8,places.length);let arr=[];for(let i=0;i<TOTAL_SCENES;i++){let phase=i<5?'HOOK':i<12?'SETUP':i<27?'JOURNEY':i<35?'CLIMAX':'ENDING';let place=places[(base+i)%places.length];let action=actions[(i+n)%actions.length],emotion=moods[(i+n)%moods.length];let text=phase==='HOOK'?(i===0?'आज Viko के सामने '+h+'. क्या वह इसे समझ पाएगा?':'Viko ध्यान से clue को देखता है और Nubi से कहता है कि हमें '+g+' है।'):phase==='SETUP'?'Viko और Nubi '+place+' की ओर निकलते हैं। रास्ते में उन्हें नया clue मिलता है।':phase==='JOURNEY'?'Journey आसान नहीं है। एक नया obstacle सामने आता है, लेकिन दोनों मिलकर '+g+' की कोशिश करते हैं।':phase==='CLIMAX'?'सबसे बड़ा twist सामने आता है। Viko हिम्मत करता है और आखिरी challenge पूरा करने की कोशिश करता है।':'Mystery solve हो जाती है। Viko और Nubi खुश हैं और अगली journey की तैयारी करते हैं।';arr.push({title:phase+' '+(i+1),text,place,action,emotion,duration:SCENE_SEC})}return{id:n,title:'Viko New Journey #'+n+' — '+h,description:'Viko और Nubi की नई original adventure: '+h+' और goal है '+g+'.',scenes:arr,hashtags:'#Viko #VikoNewJourney #Cartoon #Adventure #FunnyCartoon'} }
function buildLibrary(count){s.library=[];for(let i=1;i<=count;i++)s.library.push(makeEpisode(i));s.episodeNo=1;s.scenes=s.library[0].scenes;active=0;save();render()}
function current(){return s.library[s.episodeNo-1]||{id:s.episodeNo,title:s.title,scenes:s.scenes,description:'',hashtags:''}}
function factory(){return '<section class="page"><div class="grid"><div><div class="card"><div class="h">🏭 1000 Video Production</div><p class="muted">एक ही बार में 20-minute episode plans की library बनाओ। हर episode में 40 scenes × 30 seconds = 20 minutes.</p><div class="field"><label>Library size</label><select id="size"><option>10</option><option>30</option><option>100</option><option>365</option><option selected>1000</option></select></div><button id="make" class="btn primary wide">⚡ Generate Episode Library</button></div><div class="card"><div class="stat"><div><b>'+s.library.length+'</b><span class="small">Episodes</span></div><div><b>20:00</b><span class="small">Long video</span></div><div><b>60s</b><span class="small">Short format</span></div></div></div></div><div class="card"><div class="h">📅 Daily system</div><p class="muted">Library में रोज़ का नया episode ready रहेगा। उसी long episode से 60-second Shorts के लिए scene blocks चुने जा सकते हैं।</p><div class="notice">1000 videos automatically YouTube पर publish नहीं होंगे। Upload/API authorization अलग step है और हर video को review करना जरूरी है।</div></div></div><div class="card"><div class="h">Episode Library</div>'+s.library.slice(0,25).map((e,i)=>'<div class="scene '+(i===s.episodeNo-1?'on':'')+'"><b>#'+e.id+' — '+esc(e.title)+'</b><div class="small">40 scenes • 20:00 • 1 long + Shorts</div></div>').join('')+(s.library.length>25?'<div class="small">पहले 25 दिख रहे हैं; बाकी library में saved हैं।</div>':'')+'</div></section>'}
function character(){return '<section class="page"><div class="grid"><div class="card"><div class="hero"><canvas id="art" width="720" height="520"></canvas></div></div><div class="card"><div class="h">👦 Viko + 🤖 Nubi</div><div class="field"><label>Viko</label><input id="name" value="'+esc(s.name)+'"></div><div class="field"><label>Companion</label><input id="comp" value="'+esc(s.companion)+'"></div><button id="cs" class="btn primary">Save Character</button><p class="muted">Design पूरे channel में consistent रखने के लिए character names/settings एक जगह रखे गए हैं।</p></div></div></section>'}
function episode(){let e=current(),x=e.scenes[active]||e.scenes[0];return '<section class="page"><div class="card"><div class="h">📝 20-Minute Episode</div><div class="field"><label>Episode number</label><input id="ep" type="number" min="1" max="'+Math.max(1,s.library.length)+'" value="'+s.episodeNo+'"></div><button id="loadEp" class="btn primary">Load Episode</button><p class="muted">'+esc(e.title)+' • 40 scenes × 30 sec = 20:00</p></div><div class="card"><div class="h">Scene '+(active+1)+' / 40</div><div class="field"><label>Scene title</label><input id="sceneTitle" value="'+esc(x?.title)+'"></div><div class="field"><label>Dialogue / narration</label><textarea id="sceneText">'+esc(x?.text)+'</textarea></div><div class="grid"><div class="field"><label>Location</label><select id="place">'+places.map(p=>'<option '+(p===x?.place?'selected':'')+'>'+p+'</option>').join('')+'</select></div><div class="field"><label>Action</label><select id="action">'+actions.map(a=>'<option '+(a===x?.action?'selected':'')+'>'+a+'</option>').join('')+'</select></div></div><button id="apply" class="btn primary">Save Scene</button></div><div class="card"><div class="h">Timeline</div>'+e.scenes.map((z,i)=>'<div class="scene '+(i===active?'on':'')+'" data-i="'+i+'"><b>'+(i+1)+'. '+esc(z.title)+'</b><div class="small">'+esc(z.place)+' • '+z.action+' • 30 sec</div></div>').join('')+'</div></section>'}
function video(){let e=current();return '<section class="page"><div class="card"><div class="h">🎬 Long Video + Shorts</div><div class="hero"><canvas id="vid" width="720" height="1280"></canvas></div><div class="bar"><i id="meter"></i></div><p id="cap" class="muted">Episode #'+e.id+' • 20:00</p><div class="actions"><button id="play" class="btn primary">▶ Preview</button><button id="stop" class="btn">■ Stop</button><button id="voice" class="btn">🔊 Speak Scene</button><button id="mic" class="btn">🎙️ Record 20m + Mic</button></div><div class="card" style="margin-top:10px"><div class="h">⚡ 60-sec Short</div><p class="muted">किसी भी 2 scenes को 60-sec Short में preview/record करने के लिए चुनो।</p><div class="actions"><button id="short1" class="btn">Short: Scene '+(active+1)+'</button><button id="short2" class="btn">Short: Next 2 Scenes</button></div></div><div class="notice">Long video recording real-time चलेगी: 20-minute video के लिए browser को लगभग 20 minutes recording करनी होगी। Mic option आपकी अपनी narration को video audio track में record कर सकता है।</div></div></section>'}
function exportPage(){let e=current();return '<section class="page"><div class="card"><div class="h">📦 Production Export</div><div class="actions"><button id="json" class="btn primary">Download Library JSON</button><button id="csv" class="btn">Download 1000 Titles CSV</button><button id="script" class="btn">Download Current Script TXT</button></div></div><div class="card"><div class="h">Current Episode</div><p class="muted">'+esc(e.title)+'</p><p class="small">40 scenes • 20 minutes • '+esc(e.hashtags)+'</p></div></section>'}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===s.page));document.getElementById('root').innerHTML=s.page==='factory'?factory():s.page==='character'?character():s.page==='episode'?episode():s.page==='video'?video():exportPage();bind();draw()}
function bind(){document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{s.page=b.dataset.p;save();render()});document.getElementById('save').onclick=()=>{save();document.getElementById('save').textContent='Saved ✓';setTimeout(()=>document.getElementById('save').textContent='Save',900)};let m=document.getElementById('make');if(m)m.onclick=()=>buildLibrary(+document.getElementById('size').value);let cs=document.getElementById('cs');if(cs)cs.onclick=()=>{s.name=document.getElementById('name').value||'Viko';s.companion=document.getElementById('comp').value||'Nubi';save();render()};let le=document.getElementById('loadEp');if(le)le.onclick=()=>{let n=Math.max(1,Math.min(s.library.length||1,+document.getElementById('ep').value||1));s.episodeNo=n;s.scenes=s.library[n-1]?.scenes||makeEpisode(n).scenes;active=0;save();render()};document.querySelectorAll('[data-i]').forEach(z=>z.onclick=()=>{active=+z.dataset.i;render()});let ap=document.getElementById('apply');if(ap)ap.onclick=()=>{let x=current().scenes[active];x.title=document.getElementById('sceneTitle').value;x.text=document.getElementById('sceneText').value;x.place=document.getElementById('place').value;x.action=document.getElementById('action').value;save();render()};let pl=document.getElementById('play');if(pl)pl.onclick=()=>play(0,40);let st=document.getElementById('stop');if(st)st.onclick=()=>playing=false;let vo=document.getElementById('voice');if(vo)vo.onclick=()=>speak();let mi=document.getElementById('mic');if(mi)mi.onclick=()=>recordMic();let a=document.getElementById('short1');if(a)a.onclick=()=>play(active,1);let b=document.getElementById('short2');if(b)b.onclick=()=>play(active,2);let j=document.getElementById('json');if(j)j.onclick=()=>download('viko-episode-library.json',JSON.stringify(s.library,null,2),'application/json');let c=document.getElementById('csv');if(c)c.onclick=()=>download('viko-1000-titles.csv','Episode,Title,Description,Hashtags\n'+s.library.map(e=>e.id+',"'+e.title.replaceAll('"','""')+'","'+e.description.replaceAll('"','""')+'","'+e.hashtags+'"').join('\n'),'text/csv');let t=document.getElementById('script');if(t)t.onclick=()=>download('viko-episode-'+s.episodeNo+'-script.txt',current().scenes.map((x,i)=>(i+1)+'. '+x.title+'\n'+x.text).join('\n\n'),'text/plain')}
function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type}));a.download=name;a.click()}
function bg(x,w,h,p){let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,p.includes('Cave')?'#17162d':p.includes('Sunset')?'#ef8062':'#66c8ed');g.addColorStop(.55,p.includes('Cave')?'#30284a':p.includes('Sunset')?'#f5bd6c':'#d9f5ff');g.addColorStop(1,p.includes('Home')?'#8c6851':p.includes('Cave')?'#1d1d2b':'#69a95d');x.fillStyle=g;x.fillRect(0,0,w,h);let ground=h*.78;if(p.includes('City')||p.includes('School')||p.includes('Market')){x.fillStyle='#f5cf75';x.beginPath();x.arc(w*.82,h*.14,w*.065,0,7);x.fill();for(let i=0;i<10;i++){let bx=i*w/10,bh=h*(.2+.08*(i%3));x.fillStyle=i%2?'#d88a62':'#8d70b8';x.fillRect(bx,ground-bh,w*.09,bh);x.fillStyle='#ffeaa4';for(let q=0;q<2;q++)for(let z=0;z<3;z++)x.fillRect(bx+14+z*w*.024,ground-bh+q*h*.08+h*.05,w*.013,h*.035)}x.fillStyle='#566879';x.fillRect(0,ground,w,h-ground)}if(p.includes('Home')){x.fillStyle='#ead4ba';x.fillRect(0,h*.35,w,h*.43);x.fillStyle='#b97950';x.fillRect(w*.1,h*.23,w*.3,h*.12);x.fillStyle='#8d563e';x.beginPath();x.moveTo(w*.05,h*.23);x.lineTo(w*.25,h*.07);x.lineTo(w*.45,h*.23);x.fill();x.fillStyle='#74b8d8';x.fillRect(w*.17,h*.42,w*.13,h*.12);x.fillStyle='#d9b35e';x.fillRect(w*.55,h*.49,w*.23,h*.18)}if(p.includes('Park')||p.includes('Sunset')){for(let i=0;i<10;i++){let tx=25+i*w/10;x.fillStyle='#674936';x.fillRect(tx,h*.51,10,h*.25);x.fillStyle='#2e7b46';x.beginPath();x.arc(tx+5,h*.48,38,0,7);x.fill()}x.fillStyle='#76a9c0';x.fillRect(0,h*.78,w,h*.035)}if(p.includes('Cave')){x.fillStyle='#211b34';x.beginPath();x.moveTo(0,h*.78);x.lineTo(0,h*.4);x.quadraticCurveTo(w*.5,h*.05,w,h*.4);x.lineTo(w,h*.78);x.fill();x.fillStyle='#101321';x.beginPath();x.ellipse(w*.5,h*.63,w*.31,h*.25,0,0,7);x.fill();x.fillStyle='#35ddec';for(let i=0;i<8;i++){x.beginPath();x.arc(w*.18+i*w*.09,h*(.57+.04*(i%2)),5,0,7);x.fill()}}}
function rr(x,cx,cy,w,h,r){x.beginPath();x.roundRect(cx-w/2,cy-h/2,w,h,r);x.fill()}
function viko(x,cx,cy,z,act,mood){x.save();let t=performance.now()/1000,move=act==='run'?Math.sin(t*12):act==='walk'?Math.sin(t*7):0,jump=act==='jump'?Math.abs(Math.sin(t*5))*z*.18:0;x.translate(cx,cy-jump);x.fillStyle='#00000022';x.beginPath();x.ellipse(0,z*.57,z*.34,z*.07,0,0,7);x.fill();x.fillStyle='#f0b184';rr(x,-z*.16+move*z*.12,z*.48,z*.17,z*.62,z*.055);rr(x,z*.16-move*z*.12,z*.48,z*.17,z*.62,z*.055);x.fillStyle='#315fc9';rr(x,0,z*.08,z*.78,z*.7,z*.13);x.strokeStyle='#f0b184';x.lineWidth=z*.085;x.lineCap='round';x.beginPath();let arm=act==='run'?move*z*.35:act==='jump'?-z*.25:0;x.moveTo(-z*.36,-z*.02);x.lineTo(-z*.52,z*.22+arm);x.moveTo(z*.36,-z*.02);x.lineTo(z*.52,z*.22-arm);x.stroke();x.fillStyle='#f0b184';x.beginPath();x.arc(0,-z*.45,z*.34,0,7);x.fill();x.fillStyle='#302039';x.beginPath();x.arc(0,-z*.58,z*.35,Math.PI,7);x.fill();x.fillStyle='#fff';x.beginPath();x.ellipse(-z*.11,-z*.45,z*.065,z*.075,0,0,7);x.ellipse(z*.11,-z*.45,z*.065,z*.075,0,0,7);x.fill();x.fillStyle='#182033';x.beginPath();x.arc(-z*.11,-z*.45,z*.032,0,7);x.arc(z*.11,-z*.45,z*.032,0,7);x.fill();x.strokeStyle='#8d4152';x.lineWidth=z*.024;x.beginPath();mood==='surprised'?x.arc(0,-z*.31,z*.075,0,7):mood==='worried'?x.arc(0,-z*.27,z*.09,Math.PI,7):x.arc(0,-z*.32,z*.1,0,Math.PI);x.stroke();x.restore()}
function nubi(x,cx,cy,z){x.save();let t=performance.now()/1000;x.translate(cx,cy+Math.sin(t*3)*z*.15);x.fillStyle='#7757ed';x.beginPath();x.ellipse(0,0,z,z*.72,0,0,7);x.fill();x.fillStyle='#101827';x.beginPath();x.ellipse(0,0,z*.72,z*.43,0,0,7);x.fill();x.fillStyle='#29dcef';x.beginPath();x.arc(-z*.23,0,z*.08,0,7);x.arc(z*.23,0,z*.08,0,7);x.fill();x.restore()}
function draw(){let c=document.getElementById('art')||document.getElementById('vid');if(!c)return;let x=c.getContext('2d'),w=c.width,h=c.height,e=current(),sc=e.scenes[active]||e.scenes[0]||{place:'Viko City',action:'idle',emotion:'happy',title:'Viko'};bg(x,w,h,sc.place);viko(x,w*.46,h*.68,Math.min(w,h)*.22,sc.action,sc.emotion);nubi(x,w*.69,h*.45,Math.min(w,h)*.09);x.fillStyle='#06101dd9';x.fillRect(0,h*.83,w,h*.17);x.fillStyle='#fff';x.font='bold '+Math.max(20,w*.035)+'px system-ui';x.fillText('VIKO NEW JOURNEY',w*.05,h*.89);x.font=Math.max(14,w*.022)+'px system-ui';x.fillText('Episode '+e.id+' • '+sc.title,w*.05,h*.95)}
function play(start,count){let e=current();if(!e.scenes.length){alert('Factory में पहले library generate करो।');return}playing=true;let begin=start,limit=Math.min(e.scenes.length,start+count),total=e.scenes.slice(begin,limit).reduce((a,z)=>a+(+z.duration||30),0)*1000,startTime=performance.now();function tick(now){if(!playing)return;let elapsed=now-startTime,acc=0,i=begin;while(i<limit&&elapsed>=acc+(+e.scenes[i].duration||30)*1000){acc+=(+e.scenes[i].duration||30)*1000;i++}if(i>=limit){playing=false;active=limit-1;draw();return}active=i;draw();let m=document.getElementById('meter');if(m)m.style.width=(elapsed/total*100)+'%';let cap=document.getElementById('cap');if(cap)cap.textContent='Episode #'+e.id+' • Scene '+(i+1)+' / 40 • '+e.scenes[i].text;requestAnimationFrame(tick)}requestAnimationFrame(tick)}
function speak(){if(!('speechSynthesis'in window)){alert('Voice preview इस browser में उपलब्ध नहीं है।');return}let z=current().scenes[active];let u=new SpeechSynthesisUtterance(z.text);u.lang='hi-IN';u.rate=.92;u.pitch=1.03;speechSynthesis.cancel();speechSynthesis.speak(u)}
async function recordMic(){let c=document.getElementById('vid');if(!c||!c.captureStream){alert('Video recording इस browser में supported नहीं है।');return}let e=current();if(!e.scenes.length){alert('पहले library बनाओ।');return}let mic;try{mic=await navigator.mediaDevices.getUserMedia({audio:true})}catch(err){alert('Microphone permission नहीं मिली।');return}let stream=c.captureStream(30);mic.getAudioTracks().forEach(t=>stream.addTrack(t));let type=MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm',r=new MediaRecorder(stream,{mimeType:type}),chunks=[];r.ondataavailable=q=>q.data.size&&chunks.push(q.data);r.onstop=()=>{mic.getTracks().forEach(t=>t.stop());download('viko-episode-'+e.id+'-20min.webm',new Blob(chunks,{type}),'video/webm')};r.start(1000);playing=true;let startTime=performance.now(),total=e.scenes.reduce((a,z)=>a+(+z.duration||30),0)*1000;function tick(now){if(!playing){r.stop();return}let elapsed=now-startTime;if(elapsed>=total){playing=false;r.stop();return}let acc=0,i=0;while(i<e.scenes.length&&elapsed>=acc+(+e.scenes[i].duration||30)*1000){acc+=(+e.scenes[i].duration||30)*1000;i++}active=i;draw();requestAnimationFrame(tick)}requestAnimationFrame(tick)}
