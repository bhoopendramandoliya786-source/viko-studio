<style>
*{box-sizing:border-box}body{margin:0;background:#070b12;color:#f4f7fb;font-family:system-ui,sans-serif}.app{max-width:1000px;margin:auto;padding-bottom:80px}.top{position:sticky;top:0;z-index:5;padding:14px 16px;background:#0b111c;border-bottom:1px solid #263246;display:flex;justify-content:space-between}.brand{font-weight:900;letter-spacing:2px}.brand span{color:#22d3ee}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px;background:#0b111c;position:sticky;top:52px;z-index:4}.nav button,.btn{border:0;border-radius:10px;padding:11px 7px;background:#182235;color:#fff}.nav .on,.primary{background:#7c5cff}.page{padding:14px}.card{background:#111a29;border:1px solid #29364b;border-radius:16px;padding:16px;margin-bottom:14px}.h{font-size:20px;font-weight:850;margin-bottom:8px}.muted{color:#aab6c8;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.preview{height:390px;display:grid;place-items:center;border-radius:18px;background:radial-gradient(circle at 50% 22%,#38578b 0,#172c4d 38%,#07101e 78%);overflow:hidden;position:relative}.preview:after{content:'';position:absolute;bottom:-50px;width:80%;height:100px;border-radius:50%;background:#050a12;opacity:.75}.vikoSvg{width:min(78%,330px);height:auto;position:relative;z-index:2;filter:drop-shadow(0 18px 14px #0008)}.nubiSvg{position:absolute;width:92px;right:8%;top:26%;z-index:3;filter:drop-shadow(0 10px 8px #0007);animation:float 1.8s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px) rotate(2deg)}}.field{margin:12px 0}.field label{display:block;margin-bottom:6px;color:#cbd5e1;font-size:13px}.field input,.field textarea,.field select{width:100%;padding:11px;border-radius:10px;border:1px solid #29364b;background:#090f19;color:#fff}.field textarea{min-height:100px}.scene{padding:12px;margin:8px 0;border:1px solid #29364b;border-radius:10px;background:#0c1421}.actions{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-block;padding:6px 9px;border-radius:99px;background:#202c40;margin:3px;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.nav button{font-size:12px}}

<body>
<div class="app">
<header class="top"><div class="brand">VIKO <span>STUDIO</span></div><button class="btn primary" id="save">Save</button></header>
<nav class="nav">
<button data-page="studio">Studio</button><button data-page="character">Character</button><button data-page="story">Story</button><button data-page="animate">Animate</button><button data-page="export">Export</button>
</nav>
<main id="root"></main>
</div>
<script>
(function(){
'use strict';
var state={page:'studio',name:'Viko',personality:'Curious, funny, brave',title:'Viko Challenge',idea:'हर दिन एक नया challenge',scenes:[]};

function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function load(){try{var x=JSON.parse(localStorage.getItem('vikoStudio2'));if(x&&typeof x==='object'){if(x.page)state.page=x.page;if(x.name)state.name=x.name;if(x.personality)state.personality=x.personality;if(x.title)state.title=x.title;if(x.idea)state.idea=x.idea;if(Array.isArray(x.scenes))state.scenes=x.scenes;}}catch(e){}}
function save(){try{localStorage.setItem('vikoStudio2',JSON.stringify(state));}catch(e){}}
function go(p){state.page=p;render();}
function preview(){return '<div class="preview"><svg class="vikoSvg" viewBox="0 0 360 430" role="img" aria-label="Viko cartoon character"><defs><linearGradient id="shirt" x1="0" x2="1"><stop offset="0" stop-color="#5b6ee1"/><stop offset="1" stop-color="#7c5cff"/></linearGradient><linearGradient id="skin" x1="0" x2="0" y2="1"><stop stop-color="#ffd2a8"/><stop offset="1" stop-color="#e9a875"/></linearGradient></defs><ellipse cx="180" cy="395" rx="100" ry="17" fill="#000" opacity=".3"/><path d="M126 316 Q180 295 234 316 L248 382 Q180 405 112 382Z" fill="#26314d" stroke="#151a25" stroke-width="6"/><rect x="108" y="205" width="144" height="142" rx="43" fill="url(#shirt)" stroke="#151a25" stroke-width="7"/><path d="M112 245 Q75 270 69 318" fill="none" stroke="#f0b783" stroke-width="24" stroke-linecap="round"/><path d="M248 245 Q285 270 291 318" fill="none" stroke="#f0b783" stroke-width="24" stroke-linecap="round"/><circle cx="69" cy="320" r="13" fill="#f0b783" stroke="#151a25" stroke-width="5"/><circle cx="291" cy="320" r="13" fill="#f0b783" stroke="#151a25" stroke-width="5"/><rect x="132" y="333" width="36" height="63" rx="15" fill="#26314d"/><rect x="192" y="333" width="36" height="63" rx="15" fill="#26314d"/><ellipse cx="180" cy="145" rx="91" ry="91" fill="url(#skin)" stroke="#151a25" stroke-width="7"/><path d="M93 140 Q90 53 178 49 Q270 48 267 135 Q244 111 224 116 Q196 77 160 105 Q130 123 93 140Z" fill="#30253e" stroke="#151a25" stroke-width="7" stroke-linejoin="round"/><path d="M112 108 Q132 65 169 69" fill="none" stroke="#59456e" stroke-width="10" stroke-linecap="round"/><ellipse cx="145" cy="151" rx="10" ry="15" fill="#111827"/><ellipse cx="215" cy="151" rx="10" ry="15" fill="#111827"/><circle cx="141" cy="146" r="3" fill="#fff"/><circle cx="211" cy="146" r="3" fill="#fff"/><path d="M166 173 Q180 183 194 173" fill="none" stroke="#8b3d50" stroke-width="7" stroke-linecap="round"/><circle cx="118" cy="181" r="10" fill="#f28d91" opacity=".3"/><circle cx="242" cy="181" r="10" fill="#f28d91" opacity=".3"/><path d="M143 250 Q180 268 217 250" fill="none" stroke="#9aa9ff" stroke-width="6" opacity=".8"/><circle cx="180" cy="235" r="6" fill="#fff" opacity=".9"/></svg><svg class="nubiSvg" viewBox="0 0 120 100" aria-label="Nubi robot"><ellipse cx="60" cy="88" rx="38" ry="7" fill="#000" opacity=".25"/><rect x="16" y="20" width="88" height="60" rx="22" fill="#7c5cff" stroke="#dbeafe" stroke-width="5"/><rect x="29" y="34" width="62" height="31" rx="13" fill="#111827"/><circle cx="47" cy="50" r="6" fill="#22d3ee"/><circle cx="73" cy="50" r="6" fill="#22d3ee"/><path d="M60 20 V8" stroke="#dbeafe" stroke-width="5"/><circle cx="60" cy="6" r="6" fill="#22d3ee"/><path d="M16 48 H7 M104 48 H113" stroke="#dbeafe" stroke-width="5" stroke-linecap="round"/></svg></div>';}

function studio(){return '<section class="page"><div class="grid"><div>'+preview()+'</div><div><div class="card"><div class="h">Viko World</div><p class="muted">तुम्हारा अपना cartoon production workspace.</p><span class="badge">Funny Challenges</span><span class="badge">Life Lessons</span><span class="badge">Big Challenges</span></div><div class="card"><div class="h">One-Tap Episode</div><button class="btn primary" id="create">⚡ Create Episode</button><p class="muted">एक click में 6 scenes तैयार होंगे।</p></div><div class="card"><div class="h">Status</div><p class="muted">Scenes: '+state.scenes.length+'<br>Project: Local</p></div></div></div></section>';}

function character(){return '<section class="page"><div class="grid"><div>'+preview()+'</div><div class="card"><div class="h">Character</div><div class="field"><label>Name</label><input id="name" value="'+esc(state.name)+'"></div><div class="field"><label>Personality</label><textarea id="personality">'+esc(state.personality)+'</textarea></div><button class="btn primary" id="charSave">Update Character</button></div></div></section>';}

function story(){var html='<section class="page"><div class="card"><div class="h">Story Builder</div><div class="field"><label>Title</label><input id="title" value="'+esc(state.title)+'"></div><div class="field"><label>Story idea</label><textarea id="idea">'+esc(state.idea)+'</textarea></div><button class="btn primary" id="generate">Generate 6 Scenes</button></div><div class="card"><div class="h">Scenes</div>';if(!state.scenes.length){html+='<p class="muted">अभी scenes नहीं हैं। Generate दबाओ।</p>';}else{for(var i=0;i<state.scenes.length;i++){html+='<div class="scene"><b>Scene '+(i+1)+': '+esc(state.scenes[i].title)+'</b><p class="muted">'+esc(state.scenes[i].text)+'</p></div>';}}html+='</div></section>';return html;}

function makeScenes(){state.scenes=[['HOOK','आज Viko ने सबसे मुश्किल challenge चुना!'],['SETUP','Nubi rules समझाता है और challenge शुरू होता है।'],['START','Viko पहला बड़ा step लेता है।'],['TWIST','अचानक एक funny problem आ जाती है।'],['CLIMAX','Viko हार नहीं मानता और आखिरी कोशिश करता है।'],['PAYOFF','Challenge पूरा! Viko को एक life lesson मिलता है।']].map(function(x){return {title:x[0],text:x[1]};});save();render();}

function animate(){return '<section class="page"><div class="card"><div class="h">🎬 VIKO 3D Animation Studio</div><p class="muted">यहाँ Viko का realtime 3D episode preview, camera और scene actions चलेंगे।</p><div style="background:#05080e;border:1px solid #273449;border-radius:16px;overflow:hidden"><canvas id="viko3dCanvas" width="540" height="720" style="display:block;width:100%;height:auto"></canvas></div><div class="progress" style="height:7px;background:#08101b;border-radius:99px;overflow:hidden;margin-top:9px"><i id="vikoProgress" style="display:block;width:0;height:100%;background:linear-gradient(90deg,#7c5cff,#22d3ee)"></i></div><p id="vikoSceneText" class="muted">3D engine तैयार हो रहा है…</p><div class="actions" style="margin-top:10px"><button class="btn primary" id="play">▶ Play 3D Episode</button><button class="btn" id="stop">■ Stop</button><button class="btn" id="record">● Record</button></div></div><div class="card"><div class="h">Scene Timeline</div>'+(state.scenes.length?state.scenes.map(function(s,i){return '<div class="scene"><b>Scene '+(i+1)+' — '+esc(s.title)+'</b><p class="muted">'+esc(s.text)+'</p><span class="badge">'+['Bedroom','Bedroom','Street','Kitchen','Street','Park'][i]+'</span><span class="badge">'+['Jump','Idle','Walk','Run','Run','Jump'][i]+'</span></div>';}).join(''):'<p class="muted">पहले Story में Generate 6 Scenes दबाओ।</p>')+'</div></section>';}

function exportPage(){return '<section class="page"><div class="card"><div class="h">Export Center</div><p class="muted">Project में '+state.scenes.length+' scenes हैं।</p><div class="actions"><button class="btn primary" id="download">Download Project JSON</button><button class="btn" id="toAnimate">Open Animation</button></div></div></section>';}

function render(){
var root=document.getElementById('root');if(!root)return;
document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-page')===state.page);});
if(state.page==='studio')root.innerHTML=studio();else if(state.page==='character')root.innerHTML=character();else if(state.page==='story')root.innerHTML=story();else if(state.page==='animate')root.innerHTML=animate();else root.innerHTML=exportPage();
bind();
}
function bind(){
document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){go(b.getAttribute('data-page'));};});
var saveBtn=document.getElementById('save');if(saveBtn)saveBtn.onclick=function(){save();saveBtn.textContent='Saved ✓';setTimeout(function(){saveBtn.textContent='Save';},1200);};
var create=document.getElementById('create');if(create)create.onclick=function(){makeScenes();go('animate');};
var gen=document.getElementById('generate');if(gen)gen.onclick=function(){state.title=document.getElementById('title').value;state.idea=document.getElementById('idea').value;makeScenes();};
var cs=document.getElementById('charSave');if(cs)cs.onclick=function(){state.name=document.getElementById('name').value||'Viko';state.personality=document.getElementById('personality').value;save();render();};
var dl=document.getElementById('download');if(dl)dl.onclick=function(){var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='viko-project.json';a.click();};
var ta=document.getElementById('toAnimate');if(ta)ta.onclick=function(){go('animate');};
var play=document.getElementById('play');if(play)play.onclick=function(){play.textContent='▶ Preview Playing';setTimeout(function(){play.textContent='▶ Play Preview';},1800);};
var rec=document.getElementById('record');if(rec)rec.onclick=function(){alert('Recording module next step में connect किया जाएगा।');};
}
load();render();
})();
</script>
<script type="module">
(async function(){
try{
const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
const root=document.getElementById('root');
const oldRender=window.render;
function viko3D(){
 const box=document.createElement('div');box.className='card';box.innerHTML='<div class="h">🎬 Viko 3D Preview</div><div id="v3d" style="background:#05080e;border:1px solid #273449;border-radius:16px;overflow:hidden"><canvas style="display:block;width:100%;height:auto"></canvas></div><p class="muted">Procedural 3D Viko • realtime camera • basic walk/run/jump motion</p>';
 root.prepend(box);
 const canvas=box.querySelector('canvas'), short=true;
 canvas.width=short?540:720;canvas.height=short?720:405;
 const r=new THREE.WebGLRenderer({canvas,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(canvas.width,canvas.height,false);
 const s=new THREE.Scene();s.background=new THREE.Color(0x172b49);
 const cam=new THREE.PerspectiveCamera(35,canvas.width/canvas.height,.1,100);cam.position.set(4,3,7);cam.lookAt(0,1.8,0);
 s.add(new THREE.HemisphereLight(0xd8edff,0x182033,2));
 const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(4,8,5);s.add(sun);
 const g=new THREE.Group();s.add(g);
 const mat=(x)=>new THREE.MeshStandardMaterial({color:x,roughness:.72});
 const add=(geo,m,p)=>{const q=new THREE.Mesh(geo,m);q.position.set(...p);g.add(q);return q};
 add(new THREE.CapsuleGeometry(.65,1.05,8,16),mat(0x5b6ee1),[0,1.65,0]);
 add(new THREE.SphereGeometry(.72,24,16),mat(0xf0b483),[0,3.05,0]).scale.set(1,1.05,.9);
 add(new THREE.SphereGeometry(.74,24,12),mat(0x30253e),[0,3.32,0]).scale.set(1,.55,.93);
 [-.25,.25].forEach(x=>add(new THREE.SphereGeometry(.075,12,8),mat(0x111111),[x,3.08,.68]));
 [-.35,.35].forEach(x=>{let a=add(new THREE.CapsuleGeometry(.13,.65,6,10),mat(0xf0b483),[x,1.72,0]);a.rotation.z=x>0?-0.35:0.35});
 [-.25,.25].forEach(x=>{add(new THREE.CapsuleGeometry(.17,.72,6,10),mat(0x26314d),[x,.7,0]);add(new THREE.SphereGeometry(.22,16,10),mat(0x111827),[x,.2,.18]).scale.set(1,.55,1.3)});
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(16,16),mat(0x101927));floor.rotation.x=-Math.PI/2;s.add(floor);
 const clock=new THREE.Clock();
 function frame(){const t=clock.getElapsedTime();g.position.y=Math.abs(Math.sin(t*2.5))*.18;g.rotation.y=Math.sin(t*.7)*.15;r.render(s,cam);requestAnimationFrame(frame)} frame();
}catch(e){console.error('3D preview',e);}
})();
</script><script type="module">
(async function(){
try{
const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
let renderer,scene,camera,hero,nubi,worldGroup,raf=0,playing=false,rec=null,chunks=[];
const mat=(x)=>new THREE.MeshStandardMaterial({color:x,roughness:.72});
function add(g,geo,m,p){const q=new THREE.Mesh(geo,m);q.position.set(...p);g.add(q);return q}
function makeViko(){
 const g=new THREE.Group(),skin=mat(0xf0b483),hair=mat(0x30253e),shirt=mat(0x5b6ee1),pants=mat(0x26314d),shoe=mat(0x111827),black=mat(0x111111);
 add(g,new THREE.CapsuleGeometry(.62,1.05,8,16),shirt,[0,1.65,0]);
 add(g,new THREE.SphereGeometry(.7,24,16),skin,[0,3.02,0]).scale.set(1,.98,.9);
 add(g,new THREE.SphereGeometry(.72,24,12),hair,[0,3.3,0]).scale.set(1,.52,.92);
 [-.24,.24].forEach(x=>add(g,new THREE.SphereGeometry(.07,12,8),black,[x,3.06,.67]));
 [-.34,.34].forEach(x=>{let a=add(g,new THREE.CapsuleGeometry(.13,.62,6,10),skin,[x,1.72,0]);a.rotation.z=x>0?-.35:.35;});
 [-.24,.24].forEach(x=>{add(g,new THREE.CapsuleGeometry(.17,.72,6,10),pants,[x,.7,0]);add(g,new THREE.SphereGeometry(.22,16,10),shoe,[x,.2,.18]).scale.set(1,.55,1.3);});
 return g;
}
function makeNubi(){const g=new THREE.Group(),p=mat(0x7c5cff),d=mat(0x111827),c=mat(0x22d3ee);add(g,new THREE.SphereGeometry(.42,20,14),p,[0,0,0]).scale.set(1.3,.82,.75);[-.16,.16].forEach(x=>add(g,new THREE.SphereGeometry(.055,10,8),c,[x,.04,.38]));add(g,new THREE.CylinderGeometry(.025,.025,.22,8),d,[0,.47,0]);add(g,new THREE.SphereGeometry(.06,10,8),c,[0,.6,0]);g.position.set(1.5,2.8,0);return g;}
function makeWorld(name){
 const g=new THREE.Group(), ground=add(g,new THREE.PlaneGeometry(18,18),mat(0x182334),[0,0,0]);ground.rotation.x=-Math.PI/2;
 if(name==='bedroom'){scene.background=new THREE.Color(0x263b62);const bed=add(g,new THREE.BoxGeometry(4,.75,2),mat(0x526895),[0,.4,-2.5]);add(g,new THREE.BoxGeometry(4,2,.2),mat(0x394b6c),[0,1.35,-3.4]);}
 if(name==='street'){scene.background=new THREE.Color(0x667785);add(g,new THREE.BoxGeometry(18,.06,5),mat(0x30343a),[0,.03,-1]);for(let x=-8;x<9;x+=2)add(g,new THREE.BoxGeometry(.9,.03,.08),mat(0xe5e7eb),[x,.08,-1]);}
 if(name==='kitchen'){scene.background=new THREE.Color(0x725b4b);add(g,new THREE.BoxGeometry(6,.8,1.1),mat(0x9a806b),[0,.8,-2.4]);add(g,new THREE.BoxGeometry(6,2.8,.18),mat(0x5d4c40),[0,2.1,-3]);}
 if(name==='park'){scene.background=new THREE.Color(0x477056);for(let x=-4;x<=4;x+=4){add(g,new THREE.CylinderGeometry(.12,.16,1.4,8),mat(0x684b36),[x,.7,-2]);add(g,new THREE.SphereGeometry(.8,14,10),mat(0x2f6840),[x,1.7,-2]);}}
 return g;
}
const defaults=['bedroom','bedroom','street','kitchen','street','park'], actions=['jump','idle','walk','run','run','jump'];
function getScenes(){try{const x=JSON.parse(localStorage.getItem('vikoStudio2'));return Array.isArray(x?.scenes)&&x.scenes.length?x.scenes:[]}catch(e){return[]}}
function init(){
 const canvas=document.getElementById('viko3dCanvas');if(!canvas||renderer)return;
 const short=true;canvas.width=short?540:720;canvas.height=short?720:405;
 renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(canvas.width,canvas.height,false);
 scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(34,canvas.width/canvas.height,.1,100);camera.position.set(4.5,3.2,8);camera.lookAt(0,1.8,0);
 scene.add(new THREE.HemisphereLight(0xdceeff,0x162033,2.2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(4,8,5);scene.add(sun);
 hero=makeViko();nubi=makeNubi();scene.add(hero,nubi);worldGroup=makeWorld(defaults[0]);scene.add(worldGroup);
 const loop=()=>{if(!playing){const t=performance.now()/1000;hero.position.y=Math.abs(Math.sin(t*2))*.05;nubi.position.y=2.8+Math.sin(t*2.5)*.12;hero.rotation.y=Math.sin(t*.7)*.08;renderer.render(scene,camera)}raf=requestAnimationFrame(loop)};loop();
}
function setScene(i,t=0){
 const ss=getScenes(),s=ss[i]||{title:'Viko 3D',text:'Create an episode'};if(worldGroup)scene.remove(worldGroup);worldGroup=makeWorld(defaults[i]||'bedroom');scene.add(worldGroup);
 const a=actions[i]||'idle';hero.position.x=a==='walk'?Math.sin(t*2)*1.1:0;hero.position.y=a==='jump'?Math.abs(Math.sin(t*3))*1.1:0;hero.rotation.y=a==='run'?Math.sin(t*8)*.3:Math.sin(t*2)*.06;nubi.position.y=2.8+Math.sin(t*2.5)*.15;
 camera.position.x=4.5+Math.sin(t*.7)*.5;camera.position.z=a==='run'?7.2:8;camera.lookAt(0,1.8,0);renderer.render(scene,camera);
 const tx=document.getElementById('vikoSceneText');if(tx)tx.textContent='Scene '+(i+1)+' — '+s.title+' • '+s.text;
 const bar=document.getElementById('vikoProgress');if(bar)bar.style.width=(i/Math.max(1,ss.length)*100)+'%';
}
function play(){
 const ss=getScenes();if(!ss.length){alert('पहले Story में Generate 6 Scenes दबाओ।');return}init();playing=true;const start=performance.now(),dur=4000,total=dur*ss.length;
 const step=now=>{if(!playing)return;const e=now-start;if(e>=total){playing=false;setScene(ss.length-1,0);return}const i=Math.floor(e/dur);setScene(i,(e%dur)/1000);raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step);
}
function stop(){playing=false;if(raf)cancelAnimationFrame(raf);}
function record(){
 const ss=getScenes();init();if(!renderer||!renderer.domElement.captureStream){alert('इस browser में recording supported नहीं है।');return}stop();const stream=renderer.domElement.captureStream(30);const type=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';rec=new MediaRecorder(stream,{mimeType:type});chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type}));a.download='viko-3d-episode.webm';a.click()};rec.start();const start=performance.now(),dur=4000,total=dur*ss.length;const step=now=>{const e=now-start;if(e>=total){rec.stop();return}setScene(Math.floor(e/dur),(e%dur)/1000);requestAnimationFrame(step)};requestAnimationFrame(step);
}
