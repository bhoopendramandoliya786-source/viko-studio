<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIKO Studio</title>
<style>
:root{--bg:#090d14;--panel:#111827;--panel2:#182235;--text:#f4f7fb;--muted:#94a3b8;--accent:#7c5cff;--accent2:#22d3ee;--line:#263247}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#070a10,#101827);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1100px;margin:auto;min-height:100vh;padding-bottom:90px}.top{position:sticky;top:0;z-index:5;background:#0b1019eF;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:16px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.08em}.brand span{color:var(--accent2)}.save{background:var(--accent);color:#fff;border-radius:10px;padding:9px 14px}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px}.nav button{background:var(--panel);color:var(--muted);padding:11px 5px;border-radius:12px}.nav button.active{background:var(--panel2);color:#fff;outline:1px solid #394763}.page{padding:10px 16px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.card{background:linear-gradient(180deg,#121a29,#0f1623);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.h{font-size:20px;font-weight:800;margin-bottom:10px}.muted{color:var(--muted);font-size:14px;line-height:1.5}.field{margin:12px 0}.field label{display:block;color:#cbd5e1;font-size:13px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;background:#0a111d;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;outline:none}.field textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{background:var(--accent);color:#fff;padding:11px 15px;border-radius:10px;font-weight:700}.secondary{background:#202c40;color:#fff;padding:11px 15px;border-radius:10px}.scene{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#0d1522}.scene b{width:28px;height:28px;border-radius:8px;background:#202c40;display:grid;place-items:center}.preview{min-height:350px;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#29385a,#101827 55%,#080c13);border-radius:16px;overflow:hidden;position:relative}.floor{position:absolute;bottom:20px;width:75%;height:35px;border-radius:50%;background:#080b11}.viko{position:relative;width:180px;height:250px;z-index:2}.head{position:absolute;left:35px;top:25px;width:110px;height:105px;border-radius:50%;background:#f3bd8f;border:4px solid #171b26}.hair{position:absolute;left:34px;top:17px;width:112px;height:65px;background:#30253e;border-radius:60% 55% 35% 30%;transform:rotate(-5deg)}.eye{position:absolute;top:68px;width:12px;height:17px;background:#111;border-radius:50%;z-index:3}.e1{left:62px}.e2{left:104px}.mouth{position:absolute;left:78px;top:96px;width:25px;height:10px;border-bottom:4px solid #7d3444;border-radius:50%;z-index:3}.body{position:absolute;left:43px;top:130px;width:95px;height:100px;border-radius:28px 28px 18px 18px;background:#5b6ee1;border:4px solid #171b26}.leg{position:absolute;top:215px;width:24px;height:38px;background:#26314d;border-radius:10px}.l1{left:60px}.l2{left:100px}.phone{position:absolute;right:5px;top:146px;width:32px;height:52px;background:#111827;border:3px solid #dbeafe;border-radius:6px;z-index:4}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#1e293b;color:#cbd5e1;font-size:12px;margin:3px}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat div{background:#0b1220;border:1px solid var(--line);padding:12px;border-radius:12px;text-align:center}.big{font-size:22px;font-weight:900}.timeline{margin-top:12px}.notice{padding:12px;border-radius:12px;background:#101c30;border:1px solid #30405b;color:#cbd5e1;font-size:13px}
@media(max-width:750px){.grid{grid-template-columns:1fr}.preview{min-height:310px}.nav{position:sticky;top:61px;z-index:4;background:#0b1019}.top{padding:13px 14px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">VIKO <span>STUDIO</span></div><button class="save" onclick="saveProject()">Save</button></header>
<nav class="nav">
<button id="n-studio" onclick="show('studio')">Studio</button>
<button id="n-character" onclick="show('character')">Character</button>
<button id="n-story" onclick="show('story')">Story</button>
<button id="n-export" onclick="show('export')">Export</button>
</nav>
<main id="root"></main>
</div>
<script>
const state={page:'studio',character:{name:'Viko',personality:'Curious, funny, brave, कभी-कभी lazy लेकिन हार नहीं मानता'},story:{title:'Viko Tries to Survive 24 Hours Without His Phone',idea:'एक मजेदार 24 घंटे का no-phone challenge'},scenes:[]};
function saveProject(){localStorage.setItem('vikoStudio',JSON.stringify(state));alert('Project saved on this phone.');}
function load(){try{Object.assign(state,JSON.parse(localStorage.getItem('vikoStudio'))||{});}catch(e){}}
function show(p){state.page=p;render();}
function preview(){return '<div class="preview"><div class="floor"></div><div class="viko"><div class="hair"></div><div class="head"></div><div class="eye e1"></div><div class="eye e2"></div><div class="mouth"></div><div class="body"></div><div class="leg l1"></div><div class="leg l2"></div><div class="phone"></div></div></div>'}
function studio(){return '<section class="page"><div class="grid"><div>'+preview()+'</div><div><div class="card"><div class="h">Viko World</div><p class="muted">यह तुम्हारा reusable cartoon production workspace है। Character, scenes और stories एक ही project में रखो।</p><div class="stat"><div><div class="big">1</div><span class="muted">Hero</span></div><div><div class="big">'+state.scenes.length+'</div><span class="muted">Scenes</span></div><div><div class="big">2</div><span class="muted">Formats</span></div></div></div><div class="card"><div class="h">Content pillars</div><span class="badge">Funny Challenges</span><span class="badge">Life Lessons</span><span class="badge">Big Challenges</span><p class="muted">एक challenge से Short, Long और compilation जैसे कई outputs बनाए जा सकते हैं।</p></div></div></div></section>'}
function character(){return '<section class="page"><div class="grid"><div class="card">'+preview()+'</div><div class="card"><div class="h">Character Library</div><div class="field"><label>Character name</label><input id="cname" value="'+esc(state.character.name)+'"></div><div class="field"><label>Personality</label><textarea id="cp">'+esc(state.character.personality)+'</textarea></div><button class="primary" onclick="updateChar()">Update Character</button><div class="notice" style="margin-top:12px">Viko is a working brand name; trademark/handle availability अभी verify नहीं की गई है।</div></div></div></section>'}
function updateChar(){state.character.name=document.getElementById('cname').value||'Viko';state.character.personality=document.getElementById('cp').value;saveProject();render();}
function story(){return '<section class="page"><div class="grid"><div class="card"><div class="h">Story Builder</div><div class="field"><label>Challenge</label><select id="stype"><option>24 Hours Without Phone</option><option>Survive With ₹0</option><option>Last To Leave The Room</option><option>Impossible Food Challenge</option><option>Custom Challenge</option></select></div><div class="field"><label>Story idea</label><textarea id="idea">'+esc(state.story.idea)+'</textarea></div><button class="primary" onclick="generate()">Generate 6 Scenes</button></div><div class="card"><div class="h">Current title</div><div class="field"><input id="title" value="'+esc(state.story.title)+'"></div><div class="muted">Generate करने पर Hook → Setup → Challenge → Twist → Climax → Ending structure बनेगा।</div></div></div><div class="card timeline"><div class="h">Scene Timeline</div>'+(state.scenes.length?state.scenes.map((s,i)=>'<div class="scene"><b>'+(i+1)+'</b><div><strong>'+esc(s.t)+'</strong><div class="muted">'+esc(s.d)+'</div></div></div>').join(''):'<p class="muted">अभी scenes नहीं हैं। ऊपर Generate दबाओ।</p>')+'</div></section>'}
function generate(){state.story.title=document.getElementById('title').value;state.story.idea=document.getElementById('idea').value;const c=document.getElementById('stype').value;state.scenes=[['Hook','Viko को पता चलता है कि आज का challenge आसान नहीं है।'],['Setup','Nubi challenge के rules बताता है: '+c+'.'],['Challenge Begins','पहले कुछ घंटे funny लगते हैं, फिर Viko की मुश्किल शुरू होती है।'],['Funny Twist','एक unexpected problem आती है और Viko का plan उल्टा पड़ जाता है।'],['Climax','Viko हार मानने के बजाय नया तरीका आजमाता है।'],['Ending','Challenge पूरा होता है और Viko को एक छोटी life lesson मिलती है।']].map(x=>({t:x[0],d:x[1]}));saveProject();render();}
function exp(){return '<section class="page"><div class="card"><div class="h">Export Planner</div><div class="field"><label>Format</label><select id="format"><option>Short — 9:16</option><option>Long — 16:9</option></select></div><div class="notice">यह पहला browser prototype है। अभी यह actual MP4 render नहीं करता; अगला चरण real animation/render pipeline जोड़ना है।</div><div class="actions" style="margin-top:12px"><button class="primary" onclick="downloadProject()">Download Project JSON</button><button class="secondary" onclick="alert('Next build: real MP4 rendering + voice + reusable assets.')">Render Preview</button></div></div><div class="card"><div class="h">Output plan</div><div class="scene"><b>1</b><div><strong>30–45 sec Short</strong><div class="muted">Fast hook + funny payoff</div></div></div><div class="scene"><b>2</b><div><strong>60 sec Short</strong><div class="muted">More setup + twist</div></div></div><div class="scene"><b>3</b><div><strong>5–10 min Long</strong><div class="muted">Full challenge story</div></div></div></div></section>'}
function downloadProject(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='viko-project.json';a.click();}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('n-'+state.page).classList.add('active');document.getElementById('root').innerHTML=state.page==='studio'?studio():state.page==='character'?character():state.page==='story'?story():exp();}
load();render();
</script>
</body>
</html>
