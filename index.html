<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f7fbff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1100px;margin:auto;padding-bottom:80px}.top{position:sticky;top:0;z-index:20;background:#091522ee;backdrop-filter:blur(12px);padding:12px 14px;border-bottom:1px solid #24344a;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:1000;letter-spacing:1.5px;font-size:18px}.brand span{color:#27d8ee}.nav{position:sticky;top:53px;z-index:19;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px;background:#091522f2;border-bottom:1px solid #1d2b3d}.nav button,.btn{border:0;border-radius:11px;padding:11px 9px;background:#18263a;color:#fff;font-weight:750}.nav .on,.primary{background:#6d55ff}.page{padding:14px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.card{background:#0f1b2b;border:1px solid #263850;border-radius:18px;padding:15px;margin-bottom:14px;box-shadow:0 12px 35px #0003}.h{font-size:20px;font-weight:900;margin-bottom:8px}.muted{color:#aebbd0;line-height:1.5}.field{margin:10px 0}.field label{display:block;color:#c9d5e6;font-size:13px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;background:#08121f;border:1px solid #2b3b53;color:#fff;border-radius:11px;padding:11px;outline:none}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-block;background:#1b2a40;padding:5px 9px;border-radius:99px;font-size:12px;margin:3px}.hero{border-radius:18px;overflow:hidden;background:linear-gradient(#438fd5,#a9ddff 55%,#6ba75a);position:relative;min-height:410px}.hero canvas{display:block;width:100%;height:auto}.scene-list{display:grid;gap:9px}.scene{border:1px solid #293a52;background:#0a1524;border-radius:13px;padding:11px}.scene.active{border-color:#7c66ff;box-shadow:0 0 0 1px #7c66ff55}.scene-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.small{font-size:12px;color:#9eacc0}.timeline{display:flex;gap:5px;overflow:auto;padding:4px 0 8px}.timeline button{min-width:82px;border:1px solid #2b3b53;background:#101d2f;color:#fff;border-radius:10px;padding:8px}.timeline button.on{background:#6d55ff}.meter{height:7px;background:#07101c;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6d55ff,#27d8ee)}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat div{background:#0a1524;border:1px solid #263850;border-radius:12px;padding:10px;text-align:center}.stat b{font-size:18px;display:block}.notice{padding:10px 12px;border-radius:12px;background:#13253b;color:#c9d8eb;font-size:13px}.footer{color:#7f90a7;font-size:12px;text-align:center;padding:20px}.danger{background:#38202a!important}.wide{width:100%}@media(max-width:760px){.grid{grid-template-columns:1fr}.nav button{font-size:11px;padding:10px 4px}.hero{min-height:0}.stat{grid-template-columns:1fr 1fr 1fr}}

<body>
<div class="app">
<header class="top"><div class="brand">VIKO <span>NEW JOURNEY</span></div><button id="save" class="btn primary">Save</button></header>
<nav class="nav"><button data-page="studio">Studio</button><button data-page="character">Character</button><button data-page="story">Episode</button><button data-page="animate">3D Play</button><button data-page="export">Export</button></nav>
<main id="root"></main><div class="footer">Viko World • Original cartoon universe • Mobile-first creator studio</div>
</div>
<script>
(()=>{'use strict';
const KEY='vikoStudio2';
const defaults={page:'studio',name:'Viko',personality:'Curious, funny, brave — हार नहीं मानता',title:'Viko New Journey: The Mystery in Viko City',idea:'आज Viko और Nubi को शहर के park में एक mysterious glowing signal मिलता है।',scenes:[]};
let state={...defaults,scenes:[]},active=0,recording=false;
const worlds=['City','Home','School','Park','Secret Cave','City Sunset'];
const places=['street','bedroom','school','park','cave','park'];
const actions=['walk','idle','walk','run','jump','idle'];
const emotions=['excited','happy','surprised','worried','brave','happy'];
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&typeof x==='object'){state={...defaults,...x,scenes:Array.isArray(x.scenes)?x.scenes:[]}}}catch(e){state={...defaults,scenes:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function go(p){state.page=p;save();render()}
function makeEpisode(){
 state.title='Viko New Journey: The Mystery in Viko City';
 state.idea='Viko और Nubi को park में एक glowing signal मिलता है और दोनों mystery solve करने निकलते हैं।';
 state.scenes=[
 {title:'OPENING',text:'Viko City में एक नया दिन शुरू होता है। Viko अपनी नई journey के लिए तैयार है।',place:'street',action:'walk',emotion:'excited',duration:6},
 {title:'HOME',text:'Nubi एक strange signal पकड़ता है। Viko को लगता है आज कुछ बड़ा होने वाला है।',place:'bedroom',action:'idle',emotion:'happy',duration:6},
 {title:'SCHOOL',text:'School के रास्ते में signal फिर आता है। Viko और Nubi clue follow करते हैं।',place:'school',action:'walk',emotion:'surprised',duration:7},
 {title:'PARK',text:'Park में उन्हें जमीन पर glowing निशान मिलता है। Mystery और गहरी हो जाती है।',place:'park',action:'run',emotion:'worried',duration:7},
 {title:'CLIMAX',text:'Secret cave के अंदर Viko डरता है, फिर हिम्मत करके आखिरी clue solve करता है।',place:'cave',action:'jump',emotion:'brave',duration:8},
 {title:'ENDING',text:'Mystery solve होती है। Viko और Nubi sunset में अगली journey की तैयारी करते हैं।',place:'park',action:'idle',emotion:'happy',duration:6}
 ];
 active=0;save();go('animate');
}
function studio(){return '<section class="page"><div class="grid"><div class="card"><div class="hero"><canvas id="heroCanvas" width="700" height="520"></canvas></div></div><div><div class="card"><div class="h">🎬 पूरा Cartoon Episode</div><p class="muted">Viko New Journey में एक ही challenge को अलग-अलग locations, camera shots और scenes में पूरा episode बनाया जाएगा।</p><button class="btn primary wide" id="create">⚡ Create New Episode</button></div><div class="card"><div class="stat"><div><b>'+state.scenes.length+'</b><span class="small">Scenes</span></div><div><b>'+state.scenes.reduce((a,s)=>a+(+s.duration||0),0)+'s</b><span class="small">Runtime</span></div><div><b>9:16</b><span class="small">Mobile</span></div></div></div><div class="card"><div class="h">Visual Direction</div><div class="notice">Colorful 3D cartoon-show presentation • original Viko World • expressive characters • cinematic camera • consistent locations.</div></div></div></div></section>'}
function character(){return '<section class="page"><div class="grid"><div class="card"><div class="hero"><canvas id="charCanvas" width="700" height="520"></canvas></div></div><div class="card"><div class="h">Viko Character</div><div class="field"><label>Name</label><input id="name" value="'+esc(state.name)+'"></div><div class="field"><label>Personality</label><textarea id="personality">'+esc(state.personality)+'</textarea></div><button class="btn primary" id="charSave">Update Character</button><p class="muted">Nubi Viko का floating robot companion है। दोनों की design हर scene में consistent रहेगी।</p></div></div></section>'}
function story(){let h='<section class="page"><div class="card"><div class="h">📝 Episode Builder</div><div class="field"><label>Episode Title</label><input id="title" value="'+esc(state.title)+'"></div><div class="field"><label>Story Idea</label><textarea id="idea">'+esc(state.idea)+'</textarea></div><div class="actions"><button class="btn primary" id="generate">Generate 6-Scene Episode</button><button class="btn" id="newBlank">Blank Episode</button></div></div><div class="card"><div class="h">Scene Timeline</div><div class="timeline">'+state.scenes.map((s,i)=>'<button class="'+(i===active?'on':'')+'" data-scene="'+i+'">'+(i+1)+'. '+esc(s.title)+'</button>').join('')+'</div>';
if(!state.scenes.length)h+='<p class="muted">Generate दबाकर पूरा episode बनाओ।</p>';else{const s=state.scenes[active]||state.scenes[0];h+='<div class="grid"><div><div class="field"><label>Scene Title</label><input id="stitle" value="'+esc(s.title)+'"></div><div class="field"><label>Dialogue / Narration</label><textarea id="stext">'+esc(s.text)+'</textarea></div><div class="field"><label>Location</label><select id="splace">'+places.map(p=>'<option '+(p===s.place?'selected':'')+'>'+p+'</option>').join('')+'</select></div></div><div><div class="field"><label>Action</label><select id="saction">'+['idle','walk','run','jump'].map(p=>'<option '+(p===s.action?'selected':'')+'>'+p+'</option>').join('')+'</select></div><div class="field"><label>Emotion</label><select id="semotion">'+emotions.map(p=>'<option '+(p===s.emotion?'selected':'')+'>'+p+'</option>').join('')+'</select></div><div class="field"><label>Duration (seconds)</label><input id="sdur" type="number" min="2" max="30" value="'+esc(s.duration||6)+'"></div></div></div><div class="actions"><button class="btn primary" id="applyScene">Apply Scene</button><button class="btn danger" id="deleteScene">Delete Scene</button></div>'}h+='</div></section>';return h}
function animate(){return '<section class="page"><div class="card"><div class="h">🎥 3D Cartoon Episode Player</div><div class="hero"><canvas id="viko3dCanvas" width="540" height="720"></canvas></div><div class="meter"><i id="progress"></i></div><p id="sceneText" class="muted">Episode तैयार करो।</p><div class="actions"><button class="btn primary" id="play">▶ Play Full Episode</button><button class="btn" id="stop">■ Stop</button><button class="btn" id="record">● Record</button></div></div><div class="card"><div class="h">Episode Scenes</div>'+state.scenes.map((s,i)=>'<div class="scene '+(i===active?'active':'')+'" data-jump="'+i+'"><div class="scene-head"><b>'+(i+1)+'. '+esc(s.title)+'</b><span class="small">'+esc(s.duration||6)+' sec</span></div><p class="muted">'+esc(s.text)+'</p><span class="badge">'+esc(s.place)+'</span><span class="badge">'+esc(s.action)+'</span><span class="badge">'+esc(s.emotion)+'</span></div>').join('')+'</div></section>'}
function exportPage(){return '<section class="page"><div class="card"><div class="h">📦 Export Center</div><p class="muted">Episode project को JSON में save कर सकते हो। 3D player से WebM recording भी मिलेगी।</p><div class="actions"><button class="btn primary" id="download">Download Project</button><button class="btn" id="playExport">Open 3D Player</button></div></div><div class="card"><div class="h">Production Plan</div><p class="muted">Long episode: '+state.scenes.length+' scenes • Shorts: हर scene से अलग clip • Voice: browser speech preview • Final edit: voice + music + captions जोड़कर publish.</p></div></section>'}
function render(){const r=document.getElementById('root');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.page===state.page));r.innerHTML=state.page==='studio'?studio():state.page==='character'?character():state.page==='story'?story():state.page==='animate'?animate():exportPage();bind();if(state.page==='studio')drawHero('heroCanvas');if(state.page==='character')drawHero('charCanvas')}
function bind(){
 document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
 const saveBtn=document.getElementById('save');if(saveBtn)saveBtn.onclick=()=>{save();saveBtn.textContent='Saved ✓';setTimeout(()=>saveBtn.textContent='Save',1000)};
 const create=document.getElementById('create');if(create)create.onclick=makeEpisode;
 const gen=document.getElementById('generate');if(gen)gen.onclick=()=>{state.title=document.getElementById('title').value;state.idea=document.getElementById('idea').value;makeEpisode()};
 const blank=document.getElementById('newBlank');if(blank)blank.onclick=()=>{state.scenes=[];save();render()};
 const cs=document.getElementById('charSave');if(cs)cs.onclick=()=>{state.name=document.getElementById('name').value||'Viko';state.personality=document.getElementById('personality').value;save();render()};
 document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{active=+b.dataset.scene;render()});
 const apply=document.getElementById('applyScene');if(apply)apply.onclick=()=>{const s=state.scenes[active];Object.assign(s,{title:document.getElementById('stitle').value,text:document.getElementById('stext').value,place:document.getElementById('splace').value,action:document.getElementById('saction').value,emotion:document.getElementById('semotion').value,duration:Math.max(2,+document.getElementById('sdur').value||6)});save();render()};
 const del=document.getElementById('deleteScene');if(del)del.onclick=()=>{state.scenes.splice(active,1);active=Math.max(0,active-1);save();render()};
 document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{active=+b.dataset.jump;render()});
 const dl=document.getElementById('download');if(dl)dl.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='viko-new-journey-project.json';a.click()};
 const pe=document.getElementById('playExport');if(pe)pe.onclick=()=>go('animate');
 const play=document.getElementById('play');if(play)play.onclick=playEpisode;
 const stop=document.getElementById('stop');if(stop)stop.onclick=()=>playing=false;
 const rec=document.getElementById('record');if(rec)rec.onclick=recordEpisode;
}
function drawHero(id){const c=document.getElementById(id);if(!c)return;const x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#5ab4ee');g.addColorStop(.55,'#d5f2ff');g.addColorStop(1,'#67a95b');x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='#f5d38b';x.beginPath();x.arc(w*.78,h*.2,48,0,7);x.fill();for(let i=0;i<8;i++){x.fillStyle=i%2?'#4d914f':'#39783f';x.beginPath();x.arc(50+i*95,h*.72-(i%3)*35,48,0,7);x.fill()}drawViko2D(x,w*.5,h*.64,Math.min(w,h)*.25);drawNubi2D(x,w*.73,h*.35,Math.min(w,h)*.1)}
function drawViko2D(x,cx,cy,s){x.save();x.translate(cx,cy);x.fillStyle='#27334f';x.beginPath();x.roundRect(-s*.45,s*.35,s*.9,s*.75,s*.18);x.fill();x.fillStyle='#5b6ee1';x.beginPath();x.roundRect(-s*.5,-s*.35,s,s*.8,s*.22);x.fill();x.fillStyle='#f2b88a';x.beginPath();x.arc(0,-s*.78,s*.52,0,7);x.fill();x.fillStyle='#2b2036';x.beginPath();x.arc(0,-s*.98,s*.53,Math.PI,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(-s*.17,-s*.78,s*.09,0,7);x.arc(s*.17,-s*.78,s*.09,0,7);x.fill();x.fillStyle='#182033';x.beginPath();x.arc(-s*.17,-s*.78,s*.04,0,7);x.arc(s*.17,-s*.78,s*.04,0,7);x.fill();x.strokeStyle='#8a4052';x.lineWidth=4;x.beginPath();x.arc(0,-s*.67,s*.12,0,Math.PI);x.stroke();x.restore()}
function drawNubi2D(x,cx,cy,s){x.save();x.translate(cx,cy);x.fillStyle='#7c5cff';x.beginPath();x.ellipse(0,0,s,s*.72,0,0,7);x.fill();x.fillStyle='#111827';x.beginPath();x.ellipse(0,0,s*.72,s*.45,0,0,7);x.fill();x.fillStyle='#22d3ee';x.beginPath();x.arc(-s*.25,0,s*.09,0,7);x.arc(s*.25,0,s*.09,0,7);x.fill();x.restore()}
let playing=false,recorder=null,chunks=[];
function playEpisode(){if(!state.scenes.length){alert('पहले Episode में Generate 6-Scene Episode दबाओ।');return}const start=performance.now(),durations=state.scenes.map(s=>(+s.duration||6)*1000),total=durations.reduce((a,b)=>a+b,0);playing=true;function tick(now){if(!playing)return;let e=now-start,acc=0,i=0;while(i<durations.length&&e>=acc+durations[i]){acc+=durations[i];i++}if(i>=state.scenes.length){playing=false;active=state.scenes.length-1;render();return}active=i;const p=(e-acc)/durations[i];const bar=document.getElementById('progress');if(bar)bar.style.width=((acc+(e-acc))/total*100)+'%';const tx=document.getElementById('sceneText');if(tx)tx.textContent='Scene '+(i+1)+' — '+state.scenes[i].title+' • '+state.scenes[i].text;requestAnimationFrame(tick)}requestAnimationFrame(tick)}
function recordEpisode(){const c=document.getElementById('viko3dCanvas');if(!c||!c.captureStream){alert('इस browser में recording supported नहीं है।');return}if(!state.scenes.length){alert('पहले episode बनाओ।');return}const stream=c.captureStream(30);const type=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';chunks=[];recorder=new MediaRecorder(stream,{mimeType:type});recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type}));a.download='viko-new-journey.webm';a.click()};recorder.start();playEpisode();setTimeout(()=>recorder&&recorder.state==='recording'&&recorder.stop(),state.scenes.reduce((a,s)=>a+(+s.duration||6),0)*1000+300)}
load();render();
window.vikoState=state;
})();
</script>
<script type="module">
(async()=>{
try{
const T=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
let renderer,scene,camera,hero,nubi,world,lastCanvas;
const M=c=>new T.MeshStandardMaterial({color:c,roughness:.7});
function part(g,geo,m,p){const q=new T.Mesh(geo,m);q.position.set(...p);g.add(q);return q}
function makeHero(){const g=new T.Group(),skin=M(0xf2b88a),hair=M(0x2b2036),shirt=M(0x5b6ee1),pants=M(0x27334f),shoe=M(0x111827),white=M(0xffffff),eye=M(0x182033);part(g,new T.CapsuleGeometry(.63,1.02,10,20),shirt,[0,1.65,0]).scale.z=.72;part(g,new T.SphereGeometry(.72,32,24),skin,[0,3.02,0]).scale.set(1,1,.9);part(g,new T.SphereGeometry(.75,32,18),hair,[0,3.31,0]).scale.set(1,.54,.94);[-.24,.24].forEach(x=>{part(g,new T.SphereGeometry(.08,16,12),white,[x,3.08,.66]);part(g,new T.SphereGeometry(.04,12,10),eye,[x,3.08,.72])});[-.36,.36].forEach(x=>{const a=part(g,new T.CapsuleGeometry(.13,.62,8,12),skin,[x,1.72,0]);a.rotation.z=x>0?-.4:.4});[-.25,.25].forEach(x=>{part(g,new T.CapsuleGeometry(.18,.72,8,12),pants,[x,.7,0]);part(g,new T.SphereGeometry(.23,20,14),shoe,[x,.2,.2]).scale.set(1,.55,1.35)});return g}
function makeNubi(){const g=new T.Group();part(g,new T.SphereGeometry(.44,28,20),M(0x7c5cff),[0,0,0]).scale.set(1.35,.82,.8);part(g,new T.SphereGeometry(.32,24,18),M(0x101827),[0,0,.34]).scale.set(1.1,.62,.25);[-.14,.14].forEach(x=>part(g,new T.SphereGeometry(.055,12,10),M(0x22d3ee),[x,.03,.44]));return g}
function world(kind){const g=new T.Group(),floor=part(g,new T.PlaneGeometry(20,20),M(0x172231),[0,0,0]);floor.rotation.x=-Math.PI/2;if(kind==='street'){scene.background=new T.Color(0x72a6c4);part(g,new T.BoxGeometry(18,.08,5),M(0x30343a),[0,.04,-1));for(let x=-8;x<9;x+=2)part(g,new T.BoxGeometry(.9,.04,.1),M(0xf2f2f2),[x,.09,-1])}if(kind==='bedroom'){scene.background=new T.Color(0x4b75a4);part(g,new T.BoxGeometry(5,.65,2.2),M(0x5b6f9b),[0,.38,-2.5]);part(g,new T.BoxGeometry(5,2,.18),M(0x394c6c),[0,1.35,-3.5])}if(kind==='school'){scene.background=new T.Color(0x6da0c6);part(g,new T.BoxGeometry(7,3,.4),M(0xc97848),[0,1.5,-3]);part(g,new T.BoxGeometry(3,1.1,.08),M(0x315477),[0,1.9,-2.75])}if(kind==='park'){scene.background=new T.Color(0x65a36b);for(let x=-6;x<=6;x+=3){part(g,new T.CylinderGeometry(.12,.18,1.5,10),M(0x684b36),[x,.75,-2.5]);part(g,new T.SphereGeometry(.82,20,14),M(0x2f6840),[x,1.7,-2.5])}}if(kind==='cave'){scene.background=new T.Color(0x17152a);part(g,new T.SphereGeometry(4,24,12),M(0x332b46),[0,2,-3]).scale.set(1,.7,.5);part(g,new T.CylinderGeometry(.5,.5,1.8,12),M(0x22d3ee),[0,.9,-2.5])}return g}
function init(){const c=document.getElementById('viko3dCanvas');if(!c||renderer)return;if(c.width!==540)c.width=540;c.height=720;renderer=new T.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(540,720,false);scene=new T.Scene();camera=new T.PerspectiveCamera(32,540/720,.1,100);camera.position.set(4.2,3.1,8);camera.lookAt(0,1.8,0);scene.add(new T.HemisphereLight(0xeaf5ff,0x101827,2.4));const key=new T.DirectionalLight(0xffffff,3);key.position.set(4,8,6);scene.add(key);hero=makeHero();nubi=makeNubi();scene.add(hero,nubi);worldGroup('street');animate()}
function worldGroup(k){if(world){scene.remove(world)}world=world(k);scene.add(world)}
function animate(){const t=performance.now()/1000;if(hero){hero.position.y=Math.abs(Math.sin(t*2))*.05;hero.rotation.y=Math.sin(t*.7)*.06;nubi.position.set(1.5,2.85+Math.sin(t*2.4)*.12,.1);renderer.render(scene,camera)}requestAnimationFrame(animate)}
function jumpTo(i,t=0){init();const s=(window.vikoState?.scenes||[])[i]||{};worldGroup(s.place||'street');const a=s.action||'idle';hero.position.x=a==='walk'?Math.sin(t*2)*1:a==='run'?Math.sin(t*3)*1.2:0;hero.position.y=a==='jump'?Math.abs(Math.sin(t*3))*1:Math.abs(Math.sin(t*3))*.06;hero.rotation.y=a==='run'?Math.sin(t*8)*.25:0;camera.position.x=4.2+Math.sin(t*.7)*.45;camera.position.z=a==='run'?7.2:8;camera.lookAt(0,1.8,0);renderer.render(scene,camera)}
const observer=new MutationObserver(()=>{const c=document.getElementById('viko3dCanvas');if(c&&!lastCanvas){lastCanvas=c;init()}if(c&&window.vikoState?.scenes?.length){}});observer.observe(document.getElementById('root'),{childList:true,subtree:true});
window.viko3DJump=jumpTo;
}catch(e){console.error(e)}
})();
</script>
