<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071522"><title>VIKO Studio — Cartoon Episode Maker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071522;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1080px;margin:auto}.top{position:sticky;top:0;z-index:5;background:#081625ee;backdrop-filter:blur(10px);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #23364c}.brand{font-weight:950;letter-spacing:1px}.brand i{color:#25d8ed;font-style:normal}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px;background:#091827;position:sticky;top:55px;z-index:4}.nav button,.btn{border:0;border-radius:10px;background:#18283b;color:#fff;padding:10px;font-weight:800}.nav .on,.primary{background:#6b52f5}.page{padding:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#0d1b2b;border:1px solid #263b52;border-radius:16px;padding:13px;margin-bottom:12px}.h{font-size:20px;font-weight:900;margin-bottom:8px}.muted{color:#afbed1;line-height:1.5}.field{margin:9px 0}.field label{font-size:12px;color:#cbd7e6;display:block;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border-radius:10px;border:1px solid #2c4057;background:#081421;color:#fff}.field textarea{min-height:90px}.actions{display:flex;gap:7px;flex-wrap:wrap}.wide{width:100%}.episode{position:relative;background:#8ed5ef;border-radius:15px;overflow:hidden}.episode canvas{display:block;width:100%;height:auto}.bar{height:7px;background:#07111d;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:#27d8ed}.timeline{display:flex;gap:6px;overflow:auto;padding:2px 0 8px}.timeline button{min-width:90px;background:#111f30;border:1px solid #2b4058;color:#fff;border-radius:9px;padding:8px}.timeline .on{background:#6b52f5}.scene{background:#091725;border:1px solid #293d54;border-radius:12px;padding:10px;margin:7px 0}.scene b{font-size:14px}.tag{display:inline-block;background:#1b2b40;border-radius:99px;padding:3px 7px;margin:3px;font-size:11px}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat div{text-align:center;background:#091725;border:1px solid #263a50;border-radius:10px;padding:8px}.stat b{display:block;font-size:18px}.notice{background:#13263b;border-radius:11px;padding:10px;color:#cbd9e9;font-size:13px}.footer{text-align:center;color:#73859c;padding:18px;font-size:12px}@media(max-width:720px){.grid{grid-template-columns:1fr}.nav button{font-size:11px;padding:9px 3px}}
</style></head><body><div class="app">
<header class="top"><div class="brand">VIKO <i>NEW JOURNEY</i></div><button class="btn primary" id="save">Save</button></header>
<nav class="nav"><button data-page="studio">Studio</button><button data-page="character">Character</button><button data-page="story">Episode</button><button data-page="animate">🎬 Video</button><button data-page="export">Export</button></nav>
<main id="root"></main><div class="footer">Viko World • Original cartoon universe • Episode-first animation studio</div></div>
<script>
(()=>{'use strict';
const KEY='vikoStudio2',D={page:'studio',name:'Viko',personality:'Curious, funny, brave',title:'Viko New Journey',idea:'Viko और Nubi एक नई mystery के पीछे निकलते हैं।',scenes:[]};let s={...D},active=0,playing=false;
const places=['city','home','school','park','cave','sunset'],acts=['walk','idle','walk','run','jump','idle'],emos=['excited','happy','surprised','worried','brave','happy'];
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x)s={...D,...x,scenes:Array.isArray(x.scenes)?x.scenes:[]}}catch(e){s={...D}}}
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function esc(x){return String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function makeEpisode(){s.title='Viko New Journey — Mystery of the Glowing Signal';s.idea='Viko और Nubi को Viko City में एक रहस्यमयी signal मिलता है। वे clue follow करते हुए नई journey पर निकलते हैं।';s.scenes=[
{title:'OPENING',text:'Viko City में एक नया दिन शुरू होता है। Viko अपनी नई journey के लिए तैयार है।',place:'city',action:'walk',emotion:'excited',duration:6},
{title:'HOME',text:'Nubi एक strange glowing signal पकड़ता है। Viko तुरंत उसके पीछे जाने का फैसला करता है।',place:'home',action:'idle',emotion:'happy',duration:6},
{title:'SCHOOL',text:'School के पास signal फिर चमकता है। दोनों को पहला बड़ा clue मिलता है।',place:'school',action:'walk',emotion:'surprised',duration:7},
{title:'PARK',text:'Park में जमीन पर glowing निशान दिखाई देता है। Viko और Nubi तेजी से clue follow करते हैं।',place:'park',action:'run',emotion:'worried',duration:7},
{title:'CLIMAX',text:'Secret cave में Viko डरता है, फिर हिम्मत करके आखिरी clue solve करता है।',place:'cave',action:'jump',emotion:'brave',duration:8},
{title:'ENDING',text:'Mystery solve हो जाती है। Sunset में Viko और Nubi अगली journey की तैयारी करते हैं।',place:'sunset',action:'idle',emotion:'happy',duration:6}];active=0;save();go('animate')}
function studio(){return '<section class="page"><div class="grid"><div class="card"><div class="episode"><canvas id="cover" width="720" height="480"></canvas></div></div><div><div class="card"><div class="h">🎬 पूरा Cartoon Episode</div><p class="muted">यह app short clip नहीं, बल्कि opening → story → journey → climax → ending वाला पूरा original Viko episode बनाता है।</p><button id="create" class="btn primary wide">⚡ Create New Journey Episode</button></div><div class="card"><div class="stat"><div><b>'+s.scenes.length+'</b><span>Scenes</span></div><div><b>'+s.scenes.reduce((a,x)=>a+(+x.duration||0),0)+'s</b><span>Runtime</span></div><div><b>9:16</b><span>Format</span></div></div></div><div class="card"><div class="h">Graphics target</div><div class="notice">TV-cartoon जैसा colorful environment, expressive original characters, wide shots + close-ups + action shots. किसी existing show के characters/assets copy नहीं किए जाते।</div></div></div></div></section>'}
function character(){return '<section class="page"><div class="grid"><div class="card"><div class="episode"><canvas id="cover" width="720" height="480"></canvas></div></div><div class="card"><div class="h">👦 Viko</div><div class="field"><label>Name</label><input id="name" value="'+esc(s.name)+'"></div><div class="field"><label>Personality</label><textarea id="personality">'+esc(s.personality)+'</textarea></div><button class="btn primary" id="charSave">Save Character</button><p class="muted">Nubi Viko का original floating robot companion है। Character design पूरे episode में consistent रखा जाएगा।</p></div></div></section>'}
function story(){let h='<section class="page"><div class="card"><div class="h">📝 Episode Builder</div><div class="field"><label>Title</label><input id="title" value="'+esc(s.title)+'"></div><div class="field"><label>Story</label><textarea id="idea">'+esc(s.idea)+'</textarea></div><div class="actions"><button id="generate" class="btn primary">Generate 6 Scenes</button><button id="blank" class="btn">Blank</button></div></div><div class="card"><div class="h">Timeline</div><div class="timeline">'+s.scenes.map((x,i)=>'<button class="'+(i===active?'on':'')+'" data-i="'+i+'">'+(i+1)+'. '+esc(x.title)+'</button>').join('')+'</div>'+(!s.scenes.length?'<p class="muted">पहले Generate 6 Scenes दबाओ।</p>':sceneEditor())+'</div></section>';return h}
function sceneEditor(){const x=s.scenes[active];return '<div class="grid"><div><div class="field"><label>Scene title</label><input id="stitle" value="'+esc(x.title)+'"></div><div class="field"><label>Dialogue / narration</label><textarea id="stext">'+esc(x.text)+'</textarea></div><div class="field"><label>Location</label><select id="place">'+places.map(v=>'<option '+(v===x.place?'selected':'')+'>'+v+'</option>').join('')+'</select></div></div><div><div class="field"><label>Action</label><select id="action">'+['idle','walk','run','jump'].map(v=>'<option '+(v===x.action?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div class="field"><label>Emotion</label><select id="emotion">'+emos.map(v=>'<option '+(v===x.emotion?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div class="field"><label>Seconds</label><input id="duration" type="number" min="2" max="30" value="'+(+x.duration||6)+'"></div></div></div><div class="actions"><button id="apply" class="btn primary">Apply Scene</button><button id="del" class="btn">Delete</button></div>'}
function animate(){return '<section class="page"><div class="card"><div class="h">🎥 Cartoon Video Maker</div><div class="episode"><canvas id="videoCanvas" width="720" height="1280"></canvas></div><div class="bar"><i id="meter"></i></div><p id="caption" class="muted">Episode ready.</p><div class="actions"><button id="play" class="btn primary">▶ Play Full Episode</button><button id="stop" class="btn">■ Stop</button><button id="record" class="btn">● Record Video</button></div></div><div class="card"><div class="h">Scenes</div>'+s.scenes.map((x,i)=>'<div class="scene"><b>'+(i+1)+'. '+esc(x.title)+'</b><p class="muted">'+esc(x.text)+'</p><span class="tag">'+x.place+'</span><span class="tag">'+x.action+'</span><span class="tag">'+x.emotion+'</span><span class="tag">'+x.duration+'s</span></div>').join('')+'</div></section>'}
function exportPage(){return '<section class="page"><div class="card"><div class="h">📦 Export</div><p class="muted">Project JSON save करो या Video tab में पूरा episode record करो। Browser WebM export देता है; बाद में voice/music/captions जोड़ सकते हो।</p><div class="actions"><button id="download" class="btn primary">Download Project</button><button id="openVideo" class="btn">Open Video Maker</button></div></div></section>'}
function go(p){s.page=p;save();render()}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.page===s.page));document.getElementById('root').innerHTML=s.page==='studio'?studio():s.page==='character'?character():s.page==='story'?story():s.page==='animate'?animate():exportPage();bind();drawAny()}
function bind(){document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));document.getElementById('save').onclick=()=>{save();document.getElementById('save').textContent='Saved ✓';setTimeout(()=>document.getElementById('save').textContent='Save',900)};const c=document.getElementById('create');if(c)c.onclick=makeEpisode;const g=document.getElementById('generate');if(g)g.onclick=()=>{s.title=document.getElementById('title').value;s.idea=document.getElementById('idea').value;makeEpisode()};const bl=document.getElementById('blank');if(bl)bl.onclick=()=>{s.scenes=[];save();render()};const cs=document.getElementById('charSave');if(cs)cs.onclick=()=>{s.name=document.getElementById('name').value||'Viko';s.personality=document.getElementById('personality').value;save();render()};document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{active=+b.dataset.i;render()});const ap=document.getElementById('apply');if(ap)ap.onclick=()=>{const x=s.scenes[active];Object.assign(x,{title:document.getElementById('stitle').value,text:document.getElementById('stext').value,place:document.getElementById('place').value,action:document.getElementById('action').value,emotion:document.getElementById('emotion').value,duration:+document.getElementById('duration').value||6});save();render()};const de=document.getElementById('del');if(de)de.onclick=()=>{s.scenes.splice(active,1);active=Math.max(0,active-1);save();render()};const dl=document.getElementById('download');if(dl)dl.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='viko-episode.json';a.click()};const ov=document.getElementById('openVideo');if(ov)ov.onclick=()=>go('animate');const pl=document.getElementById('play');if(pl)pl.onclick=playEpisode;const st=document.getElementById('stop');if(st)st.onclick=()=>playing=false;const rc=document.getElementById('record');if(rc)rc.onclick=recordVideo}
function roundRect(x,cx,cy,w,h,r){x.beginPath();x.roundRect(cx-w/2,cy-h/2,w,h,r);x.fill()}
function bg(x,w,h,p,t){let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,p==='cave'?'#17172c':p==='sunset'?'#f18c62':'#75c8ec');g.addColorStop(.62,p==='cave'?'#2b2746':p==='sunset'?'#f5c66e':'#d9f5ff');g.addColorStop(1,p==='cave'?'#191b29':p==='home'?'#8b6a55':'#6aaa58');x.fillStyle=g;x.fillRect(0,0,w,h);if(p==='city'||p==='school'){x.fillStyle='#f1c46d';x.beginPath();x.arc(w*.82,h*.16,w*.07,0,7);x.fill();for(let i=0;i<8;i++){let bx=i*w/8;x.fillStyle=i%2?'#d98c5c':'#9a6fc1';roundRect(x,bx+w/16,h*.56,w/9,h*.34,12);x.fillStyle='#fff2a8';for(let q=0;q<3;q++){x.fillRect(bx+w*.025+q*20,h*.5,w*.012,h*.035)}}}if(p==='home'){x.fillStyle='#ead7bd';x.fillRect(0,h*.34,w,h*.5);x.fillStyle='#b77d53';x.fillRect(w*.58,h*.43,w*.3,h*.09);x.fillStyle='#e9c36c';x.fillRect(w*.1,h*.48,w*.2,h*.23)}if(p==='park'||p==='sunset'){for(let i=0;i<9;i++){let tx=30+i*w/9;x.fillStyle='#684b35';x.fillRect(tx,h*.52,10,h*.22);x.fillStyle='#2d7a45';x.beginPath();x.arc(tx+5,h*.49,35,0,7);x.fill()}x.fillStyle='#74a8c0';x.fillRect(0,h*.78,w,h*.03)}if(p==='school'){x.fillStyle='#df7c4e';x.fillRect(w*.12,h*.3,w*.52,h*.35);x.fillStyle='#fff0d0';x.fillRect(w*.25,h*.48,w*.12,h*.17);x.fillRect(w*.43,h*.48,w*.12,h*.17)}if(p==='cave'){x.fillStyle='#2b203c';x.beginPath();x.arc(w*.5,h*.63,w*.34,Math.PI,0);x.fill();x.fillStyle='#28d9ed';x.beginPath();x.arc(w*.5,h*.65,w*.06,0,7);x.fill()}}
function viko(x,cx,cy,scale,pose,emo){x.save();x.translate(cx,cy);let s=scale, bob=pose==='jump'?Math.abs(Math.sin(performance.now()/180))*s*.25:Math.sin(performance.now()/300)*s*.03;x.translate(0,bob);x.fillStyle='#111827';roundRect(x,0,s*.1,s*.72,s*.28,s*.08);x.fillStyle='#27334f';roundRect(x,0,s*.42,s*.72,s*.26,s*.07);x.fillStyle='#5b6ee1';roundRect(x,0,-s*.02,s*.82,s*.58,s*.14);x.fillStyle='#f2b88a';x.beginPath();x.arc(0,-s*.48,s*.31,0,7);x.fill();x.fillStyle='#2b2036';x.beginPath();x.arc(0,-s*.62,s*.32,Math.PI,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(-s*.1,-s*.48,s*.06,0,7);x.arc(s*.1,-s*.48,s*.06,0,7);x.fill();x.fillStyle='#172033';x.beginPath();x.arc(-s*.1,-s*.48,s*.028,0,7);x.arc(s*.1,-s*.48,s*.028,0,7);x.fill();x.strokeStyle='#8a4052';x.lineWidth=s*.025;x.beginPath();if(emo==='surprised')x.arc(0,-s*.37,s*.07,0,7);else x.arc(0,-s*.37,s*.11,0,Math.PI);x.stroke();x.fillStyle='#f2b88a';let leg=pose==='run'?Math.sin(performance.now()/100)*s*.18:0;roundRect(x,-s*.16+leg,s*.55,s*.18,s*.62,s*.06);roundRect(x,s*.16-leg,s*.55,s*.18,s*.62,s*.06);x.strokeStyle='#f2b88a';x.lineWidth=s*.09;x.lineCap='round';x.beginPath();let arm=pose==='run'?Math.sin(performance.now()/100)*s*.3:0;x.moveTo(-s*.37,s*-.02);x.lineTo(-s*.5,s*.28+arm);x.moveTo(s*.37,s*-.02);x.lineTo(s*.5,s*.28-arm);x.stroke();x.restore()}
function nubi(x,cx,cy,s){x.save();x.translate(cx,cy);x.fillStyle='#7657ed';x.beginPath();x.ellipse(0,0,s,s*.7,0,0,7);x.fill();x.fillStyle='#101827';x.beginPath();x.ellipse(0,0,s*.72,s*.43,0,0,7);x.fill();x.fillStyle='#28d9ed';x.beginPath();x.arc(-s*.23,0,s*.08,0,7);x.arc(s*.23,0,s*.08,0,7);x.fill();x.restore()}
function drawScene(canvas,i,t){let x=canvas.getContext('2d'),w=canvas.width,h=canvas.height,sc=s.scenes[i]||{place:'city',action:'idle',emotion:'happy',title:'Viko'};bg(x,w,h,sc.place,t);let zoom=1+Math.sin(t*1.3)*.025;viko(x,w*.47,w*.69,Math.min(w,h)*.22*zoom,sc.action,sc.emotion);nubi(x,w*.7,w*.42,Math.min(w,h)*.085);x.fillStyle='#071522cc';x.fillRect(0,h*.82,w,h*.18);x.fillStyle='#fff';x.font='bold '+Math.max(18,w*.035)+'px system-ui';x.fillText(sc.title||'Viko',w*.05,h*.87);x.font=Math.max(13,w*.022)+'px system-ui';let txt=(sc.text||'').slice(0,90);x.fillText(txt,w*.05,h*.925);x.restore?.()}
function drawAny(){const c=document.getElementById('cover');if(c)drawScene(c,Math.min(active,s.scenes.length-1),0);const vc=document.getElementById('videoCanvas');if(vc){if(s.scenes.length)drawScene(vc,active,0);else{let x=vc.getContext('2d');x.fillStyle='#8ed5ef';x.fillRect(0,0,vc.width,vc.height)}}}
function playEpisode(){if(!s.scenes.length){alert('पहले Episode में Generate 6 Scenes दबाओ।');return}playing=true;const start=performance.now();let total=s.scenes.reduce((a,x)=>a+(+x.duration||6),0)*1000;function tick(now){if(!playing)return;let e=now-start,acc=0,i=0;while(i<s.scenes.length&&e>=acc+(+s.scenes[i].duration||6)*1000){acc+=(+s.scenes[i].duration||6)*1000;i++}if(i>=s.scenes.length){playing=false;active=s.scenes.length-1;drawAny();return}active=i;const local=(e-acc)/1000,vc=document.getElementById('videoCanvas');if(vc)drawScene(vc,i,local);let m=document.getElementById('meter');if(m)m.style.width=(e/total*100)+'%';let cap=document.getElementById('caption');if(cap)cap.textContent='Scene '+(i+1)+' — '+s.scenes[i].title+' • '+s.scenes[i].text;requestAnimationFrame(tick)}requestAnimationFrame(tick)}
function recordVideo(){const c=document.getElementById('videoCanvas');if(!c||!c.captureStream){alert('इस browser में video recording supported नहीं है।');return}if(!s.scenes.length){alert('पहले episode बनाओ।');return}playing=false;const stream=c.captureStream(30),type='video/webm';let rec;try{rec=new MediaRecorder(stream,{mimeType:type})}catch(e){rec=new MediaRecorder(stream)}let chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type}));a.download='viko-new-journey.webm';a.click()};rec.start();const start=performance.now(),total=s.scenes.reduce((a,x)=>a+(+x.duration||6),0)*1000;function tick(now){let e=now-start;if(e>=total){rec.stop();return}let acc=0,i=0;while(i<s.scenes.length&&e>=acc+(+s.scenes[i].duration||6)*1000){acc+=(+s.scenes[i].duration||6)*1000;i++}drawScene(c,i,(e-acc)/1000);requestAnimationFrame(tick)}requestAnimationFrame(tick)}
load();render();
})();
</script></body></html>
