<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIKO Studio — Cinematic Episode Engine</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06121f;color:#f7fbff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1180px;margin:auto}.top{position:sticky;top:0;z-index:20;background:#071625f7;border-bottom:1px solid #29415b;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:18px;font-weight:1000}.brand span{color:#29d9ed}.nav{position:sticky;top:52px;z-index:19;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:#081726f5;padding:7px}.nav button,.btn{border:0;border-radius:10px;background:#172b40;color:#fff;padding:10px;font-weight:850}.nav .on,.primary{background:#6b52f5}.page{padding:12px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.card{background:#0b1a2a;border:1px solid #284057;border-radius:17px;padding:13px;margin-bottom:12px}.h{font-size:20px;font-weight:950;margin-bottom:7px}.muted{color:#afc0d2;line-height:1.5}.field{margin:9px 0}.field label{display:block;font-size:12px;color:#bcd0e2;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #304961;border-radius:10px;background:#071421;color:#fff}.field textarea{min-height:90px}.actions{display:flex;gap:7px;flex-wrap:wrap}.wide{width:100%}.stage{position:relative;background:#000;border-radius:16px;overflow:hidden}.stage canvas{display:block;width:100%;height:auto}.subtitle{position:absolute;left:5%;right:5%;bottom:7%;text-align:center;font-size:clamp(15px,2.4vw,27px);font-weight:850;text-shadow:0 3px 8px #000;background:#0009;border-radius:12px;padding:7px 12px}.badge{position:absolute;top:3%;right:3%;background:#142b56e8;border-radius:99px;padding:7px 14px;font-weight:950}.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat div{background:#081624;border:1px solid #263c53;border-radius:10px;text-align:center;padding:8px}.stat b{display:block;font-size:18px}.small{font-size:12px;color:#8fa5ba}.scene{padding:9px;border:1px solid #263d55;background:#081624;border-radius:11px;margin:6px 0}.scene.on{border-color:#765dff;background:#101b37}.bar{height:8px;background:#05101a;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#29d9ed}.notice{background:#10283e;border-radius:11px;padding:10px;color:#cbd9e6;font-size:13px}.footer{text-align:center;color:#72879c;font-size:12px;padding:18px}@media(max-width:780px){.grid{grid-template-columns:1fr}.stat{grid-template-columns:repeat(2,1fr)}.nav button{font-size:10px;padding:9px 2px}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand">VIKO <span>CINEMATIC STUDIO</span></div><button id="save" class="btn primary">Save</button></header>
<nav class="nav"><button data-p="factory">Factory</button><button data-p="character">Character</button><button data-p="episode">Episode</button><button data-p="video">🎬 Video</button><button data-p="export">Export</button></nav>
<main id="root"></main><div class="footer">Original Viko World • cinematic production pipeline</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';

const KEY='vikoCinematicV3',SCENE_SEC=30,SCENES=40;
const places=['city','home','school','park','market','river','cave','sunset'];
const actions=['idle','walk','run','jump','talk','celebrate'];
const moods=['happy','excited','surprised','worried','brave'];
const hooks=['रहस्यमयी signal','secret box','अजीब map','glowing clue','strange sound','hidden door','mysterious message','Nubi का secret'];
const goals=['mystery solve करना','Nubi को ढूँढना','secret जगह तक पहुँचना','challenge पूरा करना','City को बचाना','clue का सच पता करना'];
const D={page:'factory',episodeNo:1,name:'Viko',companion:'Nubi',library:[],scenes:[]};
let s={...D},active=0,playing=false,raf=0,rec=null,recChunks=[],micStream=null,engine=null;
const assets={viko:null,nubi:null,bgUrl:null};
const gltfLoader=new GLTFLoader();

const esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(s));
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x)s={...D,...x,library:Array.isArray(x.library)?x.library:[],scenes:Array.isArray(x.scenes)?x.scenes:[]}}catch{}}
function makeEpisode(n){
 const h=hooks[(n*7)%hooks.length],g=goals[(n*11)%goals.length],arr=[];
 for(let i=0;i<SCENES;i++){const phase=i<5?'OPENING':i<12?'SETUP':i<28?'JOURNEY':i<36?'CLIMAX':'ENDING';const place=places[(n+i)%places.length],action=actions[(n+i)%actions.length],emotion=moods[(n+i)%moods.length];
 let text=phase==='OPENING'?(i===0?'आज Viko को एक '+h+' मिलता है। उसे पता नहीं कि यह उसकी पूरी journey बदल देगा।':'Viko और Nubi clue को देखते हैं और फैसला करते हैं कि उन्हें '+g+' है।'):phase==='SETUP'?'दोनों '+placeName(place)+' की तरफ निकलते हैं। रास्ते में उन्हें एक नया clue मिलता है।':phase==='JOURNEY'?'रास्ता मुश्किल है। नया obstacle सामने आता है, लेकिन Viko हार नहीं मानता और Nubi के साथ '+g+' की कोशिश करता है।':phase==='CLIMAX'?'सबसे बड़ा twist सामने आता है। Viko हिम्मत करता है और आखिरी challenge का सामना करता है।':'Mystery solve हो जाती है। Viko और Nubi खुश हैं। लेकिन अगली journey का एक नया clue फिर दिखाई देता है।';
 arr.push({title:phase+' '+(i+1),text,place,action,emotion,duration:SCENE_SEC})}
 return{id:n,title:'Viko New Journey #'+n+' — '+h,description:'Viko और Nubi की original cinematic adventure: '+h+'.',hashtags:'#Viko #VikoNewJourney #Cartoon #Adventure',scenes:arr};
}
function placeName(p){return({city:'Viko City',home:'Viko Home',school:'Viko Public School',park:'Sunny Park',market:'City Market',river:'River Road',cave:'Mystery Cave',sunset:'Viko City Sunset'})[p]||p}
function build(count){s.library=[];for(let i=1;i<=count;i++)s.library.push(makeEpisode(i));s.episodeNo=1;s.scenes=s.library[0].scenes;active=0;save();render()}
function current(){return s.library[s.episodeNo-1]||{id:s.episodeNo,title:s.title||'Viko New Journey',scenes:s.scenes||[],description:'',hashtags:''}}

function factory(){return '<section class="page"><div class="grid"><div><div class="card"><div class="h">🏭 Cinematic Episode Factory</div><p class="muted">अब engine 40 cinematic scenes बनाता है: <b>40 × 30 sec = 20 मिनट</b>. हर episode में locations, actions, camera moves, captions और story beats हैं।</p><div class="field"><label>Episodes</label><select id="count"><option>10</option><option>30</option><option>100</option><option>365</option><option selected>1000</option></select></div><button id="build" class="btn primary wide">⚡ Generate 1000-Episode Story Library</button></div><div class="card"><div class="stat"><div><b>'+s.library.length+'</b><span class="small">Episodes</span></div><div><b>20:00</b><span class="small">Long</span></div><div><b>60s</b><span class="small">Short</span></div><div><b>40</b><span class="small">Scenes</span></div></div></div></div><div class="card"><div class="h">🎥 Quality target</div><p class="muted">तुम्हारी भेजी reference जैसी cinematic feel के लिए renderer में depth, lighting, camera movement, expressive Viko और Nubi, अलग environments और subtitle layer इस्तेमाल हो रही है। Exact TV-show assets copy नहीं किए जा रहे।</p><div class="notice">Professional-quality character consistency के लिए आगे rigged GLB character asset जोड़ना सबसे बड़ा quality upgrade होगा। Three.js में GLTF/GLB और AnimationMixer इसी काम के लिए standard pipeline हैं।</div></div></div><div class="card"><div class="h">Episode Library</div>'+s.library.slice(0,30).map((e,i)=>'<div class="scene '+(i===s.episodeNo-1?'on':'')+'"><b>#'+e.id+' — '+esc(e.title)+'</b><div class="small">40 scenes • 20:00 • Shorts ready</div></div>').join('')+'</div></section>'}
function character(){return '<section class="page"><div class="grid"><div class="card"><div class="stage"><canvas id="stage" width="1280" height="720"></canvas><div class="badge">VIKO WORLD</div></div></div><div class="card"><div class="h">👦 Viko + 🤖 Nubi</div><div class="field"><label>Character name</label><input id="name" value="'+esc(s.name)+'"></div><div class="field"><label>Companion</label><input id="comp" value="'+esc(s.companion)+'"></div><button id="cs" class="btn primary">Save Character</button><p class="muted">नीला hoodie, dark hair, expressive eyes, backpack और Nubi robot पूरे universe में consistent रहेंगे।</p></div></div></section>'}
function episode(){let e=current(),x=e.scenes[active]||e.scenes[0]||makeEpisode(1).scenes[0];return '<section class="page"><div class="card"><div class="h">📝 Episode Editor</div><div class="field"><label>Episode</label><input id="ep" type="number" min="1" value="'+s.episodeNo+'"></div><button id="loadEp" class="btn primary">Load Episode</button><p class="muted">'+esc(e.title)+' • 40 scenes • 20:00</p></div><div class="card"><div class="h">Scene '+(active+1)+' / 40</div><div class="field"><label>Title</label><input id="st" value="'+esc(x.title)+'"></div><div class="field"><label>Dialogue / narration</label><textarea id="tx">'+esc(x.text)+'</textarea></div><div class="grid"><div class="field"><label>Location</label><select id="pl">'+places.map(p=>'<option value="'+p+'" '+(p===x.place?'selected':'')+'>'+placeName(p)+'</option>').join('')+'</select></div><div class="field"><label>Action</label><select id="ac">'+actions.map(a=>'<option '+(a===x.action?'selected':'')+'>'+a+'</option>').join('')+'</select></div></div><button id="apply" class="btn primary">Save Scene</button></div><div class="card"><div class="h">Timeline</div>'+e.scenes.map((z,i)=>'<div class="scene '+(i===active?'on':'')+'" data-i="'+i+'"><b>'+(i+1)+'. '+esc(z.title)+'</b><div class="small">'+placeName(z.place)+' • '+z.action+' • 30 sec</div></div>').join('')+'</div></section>'}
function video(){let e=current(),x=e.scenes[active]||e.scenes[0]||makeEpisode(1).scenes[0];return '<section class="page"><div class="card"><div class="h">🎬 Cinematic Video Renderer</div><div class="stage"><canvas id="stage" width="1280" height="720"></canvas><div id="sub" class="subtitle">'+esc(x.text)+'</div><div class="badge">Episode '+e.id+'</div></div><div class="bar"><i id="meter"></i></div><p id="status" class="muted">Scene '+(active+1)+' / 40 • 20:00 total</p><div class="actions"><button id="play" class="btn primary">▶ Play 20-Min Episode</button><button id="short" class="btn">⚡ 60-sec Short</button><button id="stop" class="btn">■ Stop</button><button id="record" class="btn">● Record Video</button><button id="mic" class="btn">🎙️ Record + Mic</button></div><div class="notice" style="margin-top:10px"><b>PRO render:</b> cinematic layered world + original Viko/Nubi fallback; uploaded GLB assets automatically replace them. Video export browser canvas को real-time capture करके होगा. 20-minute file बनाने में लगभग 20 minutes लगेंगे; background tab/screen lock recording को रोक सकता है।</div></div></section>'}
function exportPage(){return '<section class="page"><div class="card"><div class="h">📦 Export</div><div class="actions"><button id="json" class="btn primary">Download Episode Library JSON</button><button id="csv" class="btn">Download Titles CSV</button><button id="txt" class="btn">Download Current 20-min Script</button></div></div><div class="card"><div class="h">Production rule</div><p class="muted">हर long episode से 60-sec Short निकालने के लिए engine timeline में चुने हुए scenes को record करता है।</p></div></section>'}

function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===s.page));document.getElementById('root').innerHTML=s.page==='factory'?factory():s.page==='character'?character():s.page==='episode'?episode():s.page==='video'?video():exportPage();bind();if(s.page==='character'||s.page==='video')setTimeout(initStage,0)}
function bind(){
 document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{stop();s.page=b.dataset.p;save();render()});
 document.getElementById('save').onclick=()=>{save();document.getElementById('save').textContent='Saved ✓';setTimeout(()=>document.getElementById('save').textContent='Save',800)};
 const b=document.getElementById('build');if(b)b.onclick=()=>build(+document.getElementById('count').value);
 const cs=document.getElementById('cs');if(cs)cs.onclick=()=>{s.name=document.getElementById('name').value||'Viko';s.companion=document.getElementById('comp').value||'Nubi';save();render()};
 const vf=document.getElementById('vikoFile');if(vf)vf.onchange=()=>loadGLB(vf.files[0],'viko');
 const nf=document.getElementById('nubiFile');if(nf)nf.onchange=()=>loadGLB(nf.files[0],'nubi');
 const bf=document.getElementById('bgFile');if(bf)bf.onchange=()=>loadBG(bf.files[0]);
 const le=document.getElementById('loadEp');if(le)le.onclick=()=>{s.episodeNo=Math.max(1,+document.getElementById('ep').value||1);if(!s.library.length)s.library=[makeEpisode(s.episodeNo)];if(!s.library[s.episodeNo-1])s.library.push(makeEpisode(s.episodeNo));s.scenes=s.library[s.episodeNo-1].scenes;active=0;save();render()};
 document.querySelectorAll('[data-i]').forEach(z=>z.onclick=()=>{active=+z.dataset.i;render()});
 const ap=document.getElementById('apply');if(ap)ap.onclick=()=>{let x=current().scenes[active];x.title=document.getElementById('st').value;x.text=document.getElementById('tx').value;x.place=document.getElementById('pl').value;x.action=document.getElementById('ac').value;save();render()};
 const p=document.getElementById('play');if(p)p.onclick=()=>play(0,40);
 const sh=document.getElementById('short');if(sh)sh.onclick=()=>play(active,2);
 const st=document.getElementById('stop');if(st)st.onclick=stop;
 const rr=document.getElementById('record');if(rr)rr.onclick=()=>record(false);
 const mm=document.getElementById('mic');if(mm)mm.onclick=()=>record(true);
 const j=document.getElementById('json');if(j)j.onclick=()=>download('viko-library.json',JSON.stringify(s.library,null,2),'application/json');
 const c=document.getElementById('csv');if(c)c.onclick=()=>download('viko-titles.csv','Episode,Title,Description\n'+s.library.map(e=>e.id+',"'+e.title.replaceAll('"','""')+'","'+e.description.replaceAll('"','""')+'"').join('\n'),'text/csv');
 const t=document.getElementById('txt');if(t)t.onclick=()=>download('viko-episode-'+s.episodeNo+'-script.txt',current().scenes.map((x,i)=>(i+1)+'. '+x.title+'\n'+x.text).join('\n\n'),'text/plain');
}

function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function loadGLB(file,key){
 if(!file)return;
 const url=URL.createObjectURL(file);
 try{
  const gltf=await gltfLoader.loadAsync(url);
  assets[key]={root:gltf.scene,animations:gltf.animations||[],mixer:gltf.animations?.length?new THREE.AnimationMixer(gltf.scene):null,clip:null,url};
  gltf.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
  if(engine)attachAssets();
  alert((key==='viko'?'Viko':'Nubi')+' PRO asset loaded ✓');
 }catch(e){console.error(e);alert('GLB/GLTF load नहीं हुआ। GLB format try करो।')}
}
function loadBG(file){
 if(!file)return;
 if(assets.bgUrl)URL.revokeObjectURL(assets.bgUrl);
 assets.bgUrl=URL.createObjectURL(file);
 if(engine)applyBG();
 alert('Cinematic background loaded ✓');
}
function attachAssets(){
 if(!engine)return;
 if(assets.viko?.root){
  engine.scene.remove(engine.v);
  engine.v=assets.viko.root;
  engine.v.position.set(-1.25,0,0);
  engine.v.scale.setScalar(1.55);
  engine.scene.add(engine.v);
 }
 if(assets.nubi?.root){
  engine.scene.remove(engine.n);
  engine.n=assets.nubi.root;
  engine.n.position.set(1.15,1.9,0);
  engine.n.scale.setScalar(1);
  engine.scene.add(engine.n);
 }
}
function playAssetAnimation(asset,name){
 if(!asset?.mixer||!asset.animations?.length)return;
 const wanted=name.toLowerCase();
 const clip=asset.animations.find(a=>a.name.toLowerCase().includes(wanted))||asset.animations.find(a=>a.name.toLowerCase().includes('idle'))||asset.animations[0];
 if(asset.clip===clip)return;
 asset.mixer.stopAllAction();
 asset.clip=clip;
 asset.mixer.clipAction(clip).reset().fadeIn(.2).play();
}
function applyBG(){
 if(!engine)return;
 if(engine.bgMesh){engine.scene.remove(engine.bgMesh);engine.bgMesh.material.map?.dispose();engine.bgMesh.material.dispose();engine.bgMesh=null}
 if(!assets.bgUrl)return;
 const tex=new THREE.TextureLoader().load(assets.bgUrl);
 tex.colorSpace=THREE.SRGBColorSpace;
 engine.scene.background=tex;
}
function makeTextTexture(text){const c=document.createElement('canvas');c.width=1024;c.height=180;const x=c.getContext('2d');x.clearRect(0,0,1024,180);x.fillStyle='#000b';roundRect(x,20,35,984,110,22);x.fillStyle='#fff';x.font='bold 42px system-ui';x.textAlign='center';x.textBaseline='middle';let t=text.length>70?text.slice(0,67)+'…':text;x.fillText(t,512,90);return new THREE.CanvasTexture(c)}
function roundRect(x,a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function mat(c,rough=.8){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:.05})}
function box(w,h,d,c){return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c))}
function cyl(r,h,c){return new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,32),mat(c))}
function sphere(r,c){return new THREE.Mesh(new THREE.SphereGeometry(r,32,20),mat(c))}

function makeViko(){
 const g=new THREE.Group();g.name='Viko';
 const torso=box(1.45,1.55,.72,0x1558d6);torso.position.y=1.85;g.add(torso);
 const hoodie=box(1.05,.18,.76,0x0d3f9e);hoodie.position.set(0,2.45,0);g.add(hoodie);
 const head=sphere(.78,0xf1b28d);head.scale.set(1,.98,.92);head.position.y=3.08;g.add(head);
 const hair=sphere(.82,0x2b1b18);hair.scale.set(1.02,.58,.94);hair.position.set(0,3.58,-.03);g.add(hair);
 for(const sx of [-.25,.25]){const eye=sphere(.13,0xffffff);eye.scale.z=.55;eye.position.set(sx,3.12,.70);g.add(eye);const pupil=sphere(.055,0x18151b);pupil.position.set(sx,3.12,.81);g.add(pupil)}
 const mouth=new THREE.Mesh(new THREE.TorusGeometry(.17,.035,12,24,Math.PI),mat(0x8c3447));mouth.position.set(0,2.88,.75);mouth.rotation.x=Math.PI/2;g.add(mouth);
 const parts={};for(const sx of [-1,1]){const arm=cyl(.18,1.25,0xf1b28d);arm.position.set(sx*.9,1.92,0);arm.rotation.z=sx*.18;g.add(arm);parts['arm'+sx]=arm;const leg=cyl(.22,1.15,0x26364e);leg.position.set(sx*.34,.65,0);g.add(leg);parts['leg'+sx]=leg}
 const shoe1=box(.42,.22,.72,0x17202c);shoe1.position.set(-.34,.04,.16);g.add(shoe1);const shoe2=shoe1.clone();shoe2.position.x=.34;g.add(shoe2);
 g.userData={head,parts};g.scale.setScalar(1.15);return g;
}
function makeNubi(){
 const g=new THREE.Group();const body=sphere(.62,0xeaf1f6);body.scale.set(1.1,.82,1);g.add(body);const face=box(.78,.43,.08,0x07121e);face.position.z=.59;g.add(face);
 for(const sx of [-.19,.19]){const eye=sphere(.07,0x28e8ff);eye.position.set(sx,.05,.65);g.add(eye)}
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.69,.07,16,32),mat(0x36bfff));ring.rotation.x=Math.PI/2;g.add(ring);g.userData.body=body;return g;
}
function makeCinematicBackdrop(type){
 const g=new THREE.Group();
 const sky=new THREE.Mesh(new THREE.PlaneGeometry(40,24),new THREE.MeshBasicMaterial({color:type==='sunset'?0xffa06f:type==='cave'?0x171a32:0x72cbed}));
 sky.position.set(0,8,-10);g.add(sky);
 const sun=new THREE.Mesh(new THREE.CircleGeometry(2,48),new THREE.MeshBasicMaterial({color:type==='sunset'?0xffe8a0:0xfff4cf}));
 sun.position.set(type==='sunset'?5:6,7,-9.7);g.add(sun);
 const mountainMat=new THREE.MeshBasicMaterial({color:type==='cave'?0x29283b:0x5d91a2});
 for(let i=0;i<5;i++){const m=new THREE.Mesh(new THREE.ConeGeometry(4.5,5.5,4),mountainMat);m.rotation.y=Math.PI/4;m.position.set(-9+i*4.5,1.8,-7-i%2);g.add(m)}
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,20),new THREE.MeshStandardMaterial({color:type==='sunset'?0x5e8d52:0x65aa58,roughness:1}));
 ground.rotation.x=-Math.PI/2;ground.position.y=-.18;g.add(ground);
 if(type!=='cave'){for(let i=0;i<12;i++){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.16,1.5,12),mat(0x68472f));trunk.position.set(-11+i*2,.65,-4-(i%3));g.add(trunk);const crown=new THREE.Mesh(new THREE.SphereGeometry(.9,16,10),mat(i%2?0x2d884d:0x3b9b55));crown.position.set(-11+i*2,1.65,-4-(i%3));g.add(crown)}}
 return g;
}
function makeWorld(type){
 const g=new THREE.Group();g.name=type;let ground=box(24,.25,18,0x6ba45b);ground.position.y=-.15;g.add(ground);
 const sky= new THREE.Color(type==='cave'?0x15172a:type==='sunset'?0xe48a67:0x75c9ef);
 engine.scene.background=sky;
 if(type==='city'||type==='school'||type==='market'){
   for(let i=0;i<13;i++){let h=2.5+(i%4)*.8,b=box(1.5,h,1.3,[0xd9a37c,0x9d86c9,0xe6c56f,0x76a7bd][i%4]);b.position.set(-10+i*1.65,h/2-.2,-2-(i%3)*.7);g.add(b)}
   const road=box(24,.05,5,0x3e4650);road.position.set(0,.01,2.5);g.add(road);for(let i=-9;i<10;i+=2){let line=box(.9,.03,.16,0xf2d56c);line.position.set(i,.05,2.5);g.add(line)}
   if(type==='school'){const sc=box(5,2.8,1.2,0xf0d7bd);sc.position.set(0,1.3,-1);g.add(sc);const roof=box(5.5,.35,1.5,0x3976bf);roof.position.set(0,2.85,-1);g.add(roof);for(let i=-2;i<=2;i++){let w=box(.6,.7,.05,0x76c8e7);w.position.set(i,1.5,-1.65);g.add(w)}}
 } else if(type==='home'){const house=box(5,3.1,2.5,0xe7d0b8);house.position.set(0,1.45,-2);g.add(house);const roof=box(5.7,.35,2.8,0xb05d49);roof.position.set(0,3.15,-2);roof.rotation.z=.02;g.add(roof);const door=box(1,.15,1.8,0x704a38);door.position.set(0,.8,-3.3);g.add(door)}
 else if(type==='park'||type==='river'||type==='sunset'){for(let i=0;i<11;i++){const trunk=cyl(.12,1.4,0x66452f);trunk.position.set(-10+i*2, .7, -2-(i%3));g.add(trunk);const leaf=sphere(.9,0x2f8a4b);leaf.position.set(-10+i*2,1.65,-2-(i%3));g.add(leaf)}}
 else if(type==='cave'){ground.material=mat(0x29253b);const rock=sphere(5,0x252039);rock.scale.set(1,.65,.7);rock.position.set(0,2,-4);g.add(rock);for(let i=0;i<8;i++){const l=sphere(.12,0x32dfff);l.position.set(-5+i*1.4,.8,-3);g.add(l)}}
 return g;
}
function initStage(){
 const canvas=document.getElementById('stage');if(!canvas)return;
 if(engine){cancelAnimationFrame(raf);engine.renderer.dispose();engine=null}
 const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(38,16/9,.1,100);camera.position.set(7,4.4,10);camera.lookAt(0,1.9,0);
 const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(1280,720,false);renderer.shadowMap.enabled=true;
 scene.add(new THREE.HemisphereLight(0xeaf8ff,0x47627a,2.5));const sun=new THREE.DirectionalLight(0xfff2d2,3.2);sun.position.set(6,10,7);sun.castShadow=true;scene.add(sun);const rim=new THREE.DirectionalLight(0x7fdcff,1.5);rim.position.set(-7,5,-6);scene.add(rim);
 const v=makeViko(),n=makeNubi();v.position.set(-1.1,0,0);n.position.set(1.2,2.1,0);scene.add(v,n);v.traverse(o=>{if(o.isMesh)o.castShadow=true});n.traverse(o=>{if(o.isMesh)o.castShadow=true});
 const subPlane=new THREE.Mesh(new THREE.PlaneGeometry(10.5,1.05),new THREE.MeshBasicMaterial({transparent:true}));subPlane.position.set(0,-2.55,0);subPlane.visible=false;scene.add(subPlane);
 engine={scene,camera,renderer,v,n,subPlane,world:null,last:performance.now(),time:0,bgMesh:null};
 attachAssets();applyBG();setWorld();animate3d();
}
function setWorld(){if(!engine)return;let e=current(),sc=e.scenes[active]||e.scenes[0]||{place:'city',action:'idle'};if(engine.world)engine.scene.remove(engine.world);engine.world=makeWorld(sc.place);engine.scene.add(engine.world);if(assets.bgUrl)applyBG()}
function animate3d(){if(!engine)return;const now=performance.now(),dt=Math.min(.05,(now-engine.last)/1000);engine.last=now;engine.time+=dt;const e=current(),sc=e.scenes[active]||e.scenes[0]||{action:'idle'};const v=engine.v,n=engine.n;
 if(assets.viko?.mixer)assets.viko.mixer.update(dt);if(assets.nubi?.mixer)assets.nubi.mixer.update(dt);
 const realV=!!assets.viko?.root,realN=!!assets.nubi?.root;
 if(realV){v.rotation.y=Math.sin(engine.time*.35)*.05;v.position.x=-1.25+(sc.action==='run'?Math.sin(engine.time*2.5)*.35:sc.action==='walk'?Math.sin(engine.time*1.3)*.2:0);v.position.y=sc.action==='jump'?Math.abs(Math.sin(engine.time*3))*.7:0;playAssetAnimation(assets.viko,sc.action==='run'?'run':sc.action==='walk'?'walk':sc.action==='jump'?'jump':'idle')}
 else {v.rotation.y=Math.sin(engine.time*.5)*.08;if(sc.action==='walk'||sc.action==='run'){v.position.x=-1.1+Math.sin(engine.time*(sc.action==='run'?2.5:1.3))*.35;v.userData.parts['arm-1'].rotation.x=Math.sin(engine.time*6)*.45;v.userData.parts.arm1.rotation.x=-Math.sin(engine.time*6)*.45}else if(sc.action==='jump'){v.position.y=Math.abs(Math.sin(engine.time*3))*1.0}else v.position.y=0}
 if(realN){n.position.y=2+Math.sin(engine.time*2.2)*.12;n.rotation.y=Math.sin(engine.time)*.18;playAssetAnimation(assets.nubi,'idle')}else{n.position.y=2.1+Math.sin(engine.time*2.4)*.12;n.rotation.y=Math.sin(engine.time)*.25}
 const shot=active%5;const tgt=[[0,1.9,0],[-.5,1.8,0],[.8,2.1,0],[0,2.5,0],[0,1.35,0]][shot];engine.camera.position.set(6.8+Math.sin(engine.time*.16)*1.5,tgt[1]+2.0,9.5+Math.cos(engine.time*.13)*.8);engine.camera.lookAt(...tgt);
 engine.renderer.render(engine.scene,engine.camera);raf=requestAnimationFrame(animate3d)}
function setScene(i){active=Math.max(0,Math.min(current().scenes.length-1,i));setWorld();const x=current().scenes[active];const sub=document.getElementById('sub');if(sub)sub.textContent=x.text;const st=document.getElementById('status');if(st)st.textContent='Scene '+(active+1)+' / 40 • '+placeName(x.place)+' • '+x.action}
function play(start,count){stop();playing=true;const e=current(),end=Math.min(e.scenes.length,start+count),startAt=performance.now(),dur=e.scenes.slice(start,end).reduce((a,x)=>a+(x.duration||30),0)*1000;function tick(now){if(!playing)return;const elapsed=now-startAt;let acc=0,i=start;while(i<end&&elapsed>=acc+(e.scenes[i].duration||30)*1000){acc+=(e.scenes[i].duration||30)*1000;i++}if(i>=end){playing=false;setScene(end-1);return}if(i!==active)setScene(i);const meter=document.getElementById('meter');if(meter)meter.style.width=Math.min(100,elapsed/dur*100)+'%';requestAnimationFrame(tick)}requestAnimationFrame(tick)}
function stop(){playing=false;if(rec&&rec.state!=='inactive')rec.stop();if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}}
async function record(withMic){
 if(!engine||!engine.renderer?.domElement?.captureStream){alert('इस browser में video capture उपलब्ध नहीं है।');return}
 stop();const canvas=engine.renderer.domElement;const stream=canvas.captureStream(30);
 if(withMic){try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});micStream.getAudioTracks().forEach(t=>stream.addTrack(t))}catch{alert('Microphone permission नहीं मिली।');return}}
 const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm';recChunks=[];rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:9000000,audioBitsPerSecond:128000});rec.ondataavailable=e=>e.data.size&&recChunks.push(e.data);rec.onstop=()=>{download('viko-episode-'+current().id+'.webm',new Blob(recChunks,{type:mime}),mime);if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}};rec.start(1000);play(0,40);const total=40*SCENE_SEC*1000;setTimeout(()=>{if(rec&&rec.state!=='inactive'){playing=false;rec.stop()}},total+1000)}
load();if(!s.library.length){s.library=[makeEpisode(1)];s.scenes=s.library[0].scenes}render();
</script></body></html>
